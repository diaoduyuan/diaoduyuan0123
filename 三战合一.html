      ];
      this.acc = 1.0;
      G.msg = '* 蓝色灵魂：重力生效，按 Z 起跳。'; G.msgT = 0;
    },
    tick: function(dt, spd){
      this.acc -= dt;
      if (this.acc > 0) return;
      this.acc = Math.max(1.05, 1.6 - 0.24 * spd);
      var b = G.box;
      /* 骨柱高度上限 46px，保证可以起跳跃过（可躲但节奏更紧） */
      addPillar(b.x + b.w + 30, 30 + Math.random() * 16, 104 + 38 * spd);
      if (Math.random() < 0.55) {
        var x = b.x + 10 + Math.random() * (b.w - 62);
        addBone(x, b.y - 14, 50, 10, rnd(-10, 10), 140 + 44 * spd, '#e6e6e6');
      }
    },
    teardown: function(){ G.soul.mode = 'red'; G.plats = []; G.soul.vy = 0; } },

  /* 绿色格挡：四向骨矛，必须用方向键挡住来袭方向 —— 未挡住必受伤，节奏更紧 */
  greenBlock: { dur: 11,
    setup: function(){
      var b = G.box, s = G.soul;
      s.mode = 'green'; s.x = b.x + b.w / 2; s.y = b.y + b.h / 2; s.vx = 0; s.vy = 0;
      this.acc = 0.7;
      G.msg = '* 绿色灵魂：用方向键挡下攻击。'; G.msgT = 0;
    },
    tick: function(dt, spd){
      this.acc -= dt;
      if (this.acc > 0) return;
      this.acc = Math.max(0.5, 0.95 - 0.22 * spd);
      var dirs = ['left', 'right', 'up', 'down'];
      var f = G.soul.face;
      var d = dirs[Math.floor(Math.random() * 4)];
      /* 八成概率从“非当前面向”的方向袭来，逼玩家反复切换朝向 */
      if (d === f && Math.random() < 0.8) {
        d = dirs[(dirs.indexOf(d) + 1 + Math.floor(Math.random() * 3)) % 4];
      }
      addSpear(d, spd);
    },
    teardown: function(){ G.soul.mode = 'red'; } }
};

/* ============================================================
   回合控制
   ============================================================ */
function sceneNow(){ return SCENES[G.scene]; }

function startBossTurn(){
  var sc = sceneNow();
  var idx = G.patCount % sc.pats.length;
  var name = sc.pats[idx];
  G.patCount++;
  var def = PAT[name];
  var st = { acc: 0, t: 0 };
  G.pat = { name: name, def: def, st: st, dur: def.dur, spd: sc.boost };
  if (def.setup) { def.setup.call(st); }
  G.turn = 'boss';
  G.turnT = def.dur + 0.4;
  G.inten = sc.boost;
  musicSet(true, Math.max(0.22, 0.42 - 0.06 * sc.boost), 100 + 12 * sc.boost, SEQ);
  G.msg = ''; G.msgT = 0;
}

function endBossTurn(){
  if (G.pat && G.pat.def.teardown) { G.pat.def.teardown.call(G.pat.st); }
  G.pat = null;
  clearField();
  G.turn = 'player';
  G.turnT = 5.5;
  G.menu = 0;
  msgSet(TAUNTS[Math.floor(Math.random() * TAUNTS.length)]);
  musicSet(true, 0.5, 96, SEQ2);
}

function patternTick(dt){
  if (!G.pat) return;
  var p = G.pat;
  p.st.t += dt;
  p.def.tick.call(p.st, dt, p.spd);
  if (p.st.t >= p.dur) { endBossTurn(); }
}

/* ============================================================
   灵魂（心形）物理
   ============================================================ */
var SOUL_R = 6;

function soulSpeed(){ return Math.sqrt(G.soul.vx * G.soul.vx + G.soul.vy * G.soul.vy); }

function updateSoul(dt){
  var b = G.box, s = G.soul;
  var sp = 168, acc = 1500;

  if (s.mode === 'green') {
    s.vx = 0; s.vy = 0;
    if (just('left'))  { s.face = 'left';  sfxMenu(); }
    if (just('right')) { s.face = 'right'; sfxMenu(); }
    if (just('up'))    { s.face = 'up';    sfxMenu(); }
    if (just('down'))  { s.face = 'down';  sfxMenu(); }
    return;
  }

  var ix = 0, iy = 0;
  if (keys.left)  ix -= 1;
  if (keys.right) ix += 1;
  if (keys.up)    iy -= 1;
  if (keys.down)  iy += 1;

  if (s.mode === 'blue') {
    /* 重力模式：仅水平操控 + 跳跃 */
    if (ix !== 0) { s.vx += ix * acc * dt; } else { s.vx *= 0.75; }
    s.vx = clamp(s.vx, -sp, sp);
    s.vy += 860 * dt;
    if (s.vy > 520) s.vy = 520;
    if (s.onGround && (just('z') || just('up'))) { s.vy = -318; s.onGround = false; tone(420, 0.1, 'square', 0.03); }

    var px = s.x, py = s.y;
    s.x = clamp(s.x + s.vx * dt, b.x + SOUL_R, b.x + b.w - SOUL_R);
    var prevBottom = py + SOUL_R;
    s.y += s.vy * dt;
    s.onGround = false;
    var i, p;
    if (s.vy >= 0 && G.plats) {
      for (i = 0; i < G.plats.length; i++) {
        p = G.plats[i];
        if (s.x + SOUL_R > p.x && s.x - SOUL_R < p.x + p.w &&
            prevBottom <= p.y + 2 && s.y + SOUL_R >= p.y) {
          s.y = p.y - SOUL_R; s.vy = 0; s.onGround = true;
        }
      }
    }
    if (s.y + SOUL_R >= b.y + b.h) { s.y = b.y + b.h - SOUL_R; s.vy = 0; s.onGround = true; }
    if (s.y - SOUL_R < b.y) { s.y = b.y + SOUL_R; s.vy = 0; }
    return;
  }

  /* 红色：自由四向 */
  if (ix !== 0) { s.vx += ix * acc * dt; } else { s.vx *= 0.72; }
  if (iy !== 0) { s.vy += iy * acc * dt; } else { s.vy *= 0.72; }
  s.vx = clamp(s.vx, -sp, sp);
  s.vy = clamp(s.vy, -sp, sp);
  s.x = clamp(s.x + s.vx * dt, b.x + SOUL_R, b.x + b.w - SOUL_R);
  s.y = clamp(s.y + s.vy * dt, b.y + SOUL_R, b.y + b.h - SOUL_R);
}

/* ============================================================
   弹幕推进与碰撞
   ============================================================ */
function updateBullets(dt){
  var i, bl, b = G.box;
  for (i = G.bullets.length - 1; i >= 0; i--) {
    bl = G.bullets[i];
    if (bl.kind === 'skull') {
      /* 追踪：速度方向持续朝玩家当前位置偏转 —— 原地不动会被锁定命中 */
      var ax = G.soul.x - bl.x, ay = G.soul.y - bl.y;
      var ad = Math.sqrt(ax * ax + ay * ay);
      if (ad < 1) { ad = 1; }
      var turn = bl.home * dt;
      bl.vx += (ax / ad * bl.spd - bl.vx) * turn;
      bl.vy += (ay / ad * bl.spd - bl.vy) * turn;
    }
    bl.x += bl.vx * dt;
    bl.y += bl.vy * dt;
    bl.life -= dt;
    if (bl.life <= 0 ||
        bl.x + bl.w < b.x - 40 || bl.x > b.x + b.w + 40 ||
        bl.y + bl.h < b.y - 40 || bl.y > b.y + b.h + 40) {
      G.bullets.splice(i, 1);
    }
  }
}

function updateBlasters(dt){
  var i, k;
  for (i = G.blasters.length - 1; i >= 0; i--) {
    k = G.blasters[i];
    k.t += dt;
    if (k.t > k.charge && k.t < k.charge + k.fire && !k.fired) {
      k.fired = true; sfxBeam(); G.shake = 4;
    }
    if (k.t > k.charge + k.fire) { G.blasters.splice(i, 1); }
  }
}

function updateSpears(dt){
  var i, s;
  for (i = G.spears.length - 1; i >= 0; i--) {
    s = G.spears[i];
    if (!s) continue;                      /* 死亡瞬间场清空保护 */
    s.t += dt;
    var v = s.speed * dt;
    if (s.dir === 'left')  { s.x += v; }
    if (s.dir === 'right') { s.x -= v; }
    if (s.dir === 'up')    { s.y += v; }
    if (s.dir === 'down')  { s.y -= v; }
    if (s.y > G.box.y + G.box.h + 60 || s.y + s.h < G.box.y - 60 ||
        s.x > G.box.x + G.box.w + 60 || s.x + s.w < G.box.x - 60) {
      G.spears.splice(i, 1); continue;
    }
    /* 与灵魂判定 */
    var cx = s.x + s.w / 2, cy = s.y + s.h / 2;
    var dx = cx - G.soul.x, dy = cy - G.soul.y;
    if (dx * dx + dy * dy < 16 * 16) {
      if (s.dir === G.soul.face) {
        s.blocked = 1;
        burst(cx, cy, 8, '#7dff9b', 130);
        tone(900, 0.06, 'square', 0.03);
      } else {
        /* 没挡住来袭方向：必定受伤（原版直接穿过，属于无伤漏洞） */
        burst(cx, cy, 10, '#ff5555', 150);
        hurt(11);
      }
      G.spears.splice(i, 1);
    }
  }
}

function collide(dt){
  var s = G.soul, i, bl, sr;
  sr = { x: s.x - SOUL_R, y: s.y - SOUL_R, w: SOUL_R * 2, h: SOUL_R * 2 };

  for (i = G.bullets.length - 1; i >= 0; i--) {
    bl = G.bullets[i];
    if (!bl) continue;                     /* 死亡瞬间场清空保护 */
    if (!rectHit(sr.x, sr.y, sr.w, sr.h, bl.x, bl.y, bl.w, bl.h)) continue;

    if (bl.kind === 'blue') {
      if (soulSpeed() < 26) { continue; }        /* 静止穿过 */
      hurt(9); G.bullets.splice(i, 1); continue;
    }
    if (bl.kind === 'orange') {
      if (soulSpeed() >= 26) { continue; }       /* 移动穿过 */
      hurt(9); G.bullets.splice(i, 1); continue;
    }
    if (bl.kind === 'pillar') {
      hurt(9); G.bullets.splice(i, 1); continue;
    }
    if (bl.kind === 'skull') {
      hurt(11); G.bullets.splice(i, 1); continue;
    }
    hurt(8); G.bullets.splice(i, 1);
  }

  for (i = G.blasters.length - 1; i >= 0; i--) {
    var k = G.blasters[i];
    if (!k) continue;                      /* 死亡瞬间场清空保护 */
    if (k.t < k.charge || k.t > k.charge + k.fire) continue;
    var len = 900;
    var x1 = k.x, y1 = k.y;
    var x2 = k.x + Math.cos(k.ang) * len, y2 = k.y + Math.sin(k.ang) * len;
    if (distSeg(s.x, s.y, x1, y1, x2, y2) < 10 + SOUL_R) { hurt(10); }
  }
}

/* ============================================================
   受伤 / 死亡
   ============================================================ */
function hurt(dmg){
  if (G.dead || G.hurtT > 0.30) return;
  if (LOCK) {
    /* 锁血开启：保留受击的视觉反馈，但生命值不扣减、业障不累积、绝不死亡 */
    G.hurtT = 0.5;
    G.shake = 6;
    G.flash = 0.18;
    burst(G.soul.x, G.soul.y, 12, '#9be7ff', 170);
    return;
  }
  if (GOD) {
    G.hurtT = 0.5; G.shake = 8; G.flash = 0.22;
    burst(G.soul.x, G.soul.y, 14, '#ff4d4d', 190);
    return;
  }
  G.hp -= dmg;
  G.kr = Math.min(26, G.kr + 3.5);
  G.hurtT = 0.5;
  G.shake = 8;
  G.flash = 0.22;
  sfxHit();
  burst(G.soul.x, G.soul.y, 14, '#ff4d4d', 190);
  if (G.hp <= 0) { G.hp = 0; die(); }
}
function die(){
  if (LOCK) { G.hp = Math.max(1, G.hp); return; }   /* 锁血保险：任何路径都不进入死亡 */
  G.dead = true; G.deadT = 0;
  G.turn = 'dead';
  clearField();
  musicSet(false);
  sfxBreak();
  shatterSoul();
}
function shatterSoul(){
  for (var i = 0; i < 26; i++) {
    var a = Math.random() * Math.PI * 2, v = rnd(50, 200);
    G.parts.push({ x: G.soul.x, y: G.soul.y, vx: Math.cos(a) * v,
                   vy: Math.sin(a) * v - 40, life: rnd(0.6, 1.4), max: 1.4,
                   color: '#ff2b2b', size: rnd(2, 4) });
  }
}
function updateParts(dt){
  var i, p;
  for (i = G.parts.length - 1; i >= 0; i--) {
    p = G.parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 130 * dt;
    p.vx *= 0.99;
    p.life -= dt;
    if (p.life <= 0) { G.parts.splice(i, 1); }
  }
  for (i = G.shards.length - 1; i >= 0; i--) {
    p = G.shards[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 240 * dt;
    p.life -= dt;
    if (p.life <= 0) { G.shards.splice(i, 1); }
  }
}

/* 文字碎裂（Boss 倒地效果） */
function shatterChar(idx){
  var c = CHARS[idx];
  var oc = document.createElement('canvas');
  var fw = 560, fh = Math.ceil(c.size * 2.4);
  oc.width = fw; oc.height = fh;
  var octx = oc.getContext('2d');
  octx.font = 'bold ' + c.size + 'px ' + CN;
  octx.textAlign = 'center';
  octx.textBaseline = 'middle';
  octx.fillStyle = '#ffffff';
  octx.fillText(c.txt, fw / 2, fh / 2);
  var data;
  try { data = octx.getImageData(0, 0, fw, fh).data; } catch (e) { data = null; }
  var ox = c.x - fw / 2, oy = c.y - fh / 2;
  if (data) {
    for (var y = 0; y < fh; y += 3) {
      for (var x = 0; x < fw; x += 3) {
        var a = data[(y * fw + x) * 4 + 3];
        if (a > 120) {
          G.shards.push({ x: ox + x, y: oy + y,
                          vx: rnd(-70, 70), vy: rnd(-160, -40),
                          life: rnd(1.2, 2.4), max: 2.4,
                          color: c.color, size: 3 });
        }
      }
    }
  }
  c.on = false; c.alive = false;
  sfxBreak();
  G.white = 1;
  G.shake = 14;
  burst(c.x, c.y, 40, c.color, 260);
}

/* ============================================================
   玩家回合：菜单 / 战斗 / 道具 / 怜悯
   ============================================================ */
var MENU = ['FIGHT', 'ACT', 'ITEM', 'MERCY'];

function battleUpdatePlayer(dt){
  G.turnT -= dt;
  if (G.turnT <= 0) { startBossTurn(); return; }

  if (just('left') && G.menu > 0) { G.menu--; sfxMenu(); }
  if (just('right') && G.menu < 3) { G.menu++; sfxMenu(); }
  if (just('z')) {
    sfxMenu();
    if (G.menu === 0) { startSlash(); return; }
    if (G.menu === 1) {
      G.msg = '* 夏立昕 ATK 9999 DEF 9999 —— 他并没有在躲。';
      G.msgT = 0;
      CHARS[0].heat = 1;
      G.st += 0.6;
    }
    if (G.menu === 2) {
      if (G.items > 0) {
        G.items--;
        G.hp = Math.min(G.maxhp, G.hp + 40);
        G.msg = '* 你吃掉了传说英雄的遗物。* 攻击力提升 4！* 恢复了 40 点 HP！';
      } else {
        G.msg = '* 你的口袋是空的。';
      }
      G.msgT = 0;
      G.st += 0.6;
    }
    if (G.menu === 3) {
      G.msg = '* 夏立昕 拒绝了你的怜悯。';
      G.msgT = 0;
      CHARS[0].heat = 1;
      G.st += 0.6;
    }
  }
  if (G.dead) return;
}

function startSlash(){
  G.turn = 'slash';
  G.slash = { t: 0, pos: 0, dir: 1, done: 0, res: '' };
}
function slashTick(dt){
  var s = G.slash, cx = W / 2, y = 300, bw = 300;
  s.t += dt;
  if (!s.done) {
    s.pos += s.dir * dt * 1.35;
    if (s.pos >= 1) { s.pos = 1; s.dir = -1; }
    if (s.pos <= 0) { s.pos = 0; s.dir = 1; }
    if (just('z')) {
      s.done = 1;
      var center = 1 - Math.abs(s.pos - 0.5) * 2;
      s.acc = center;
      if (center > 0.82) {
        s.res = '* 会心一击！';
        CHARS[0].heat = 1.6; G.white = 0.85; G.shake = 12;
        G.bossHurt = 1; G.st += 2.4;
        tone(180, 0.5, 'sawtooth', 0.09);
        burst(CHARS[0].x, CHARS[0].y, 30, CHARS[0].color, 240);
      } else if (center > 0.35) {
        s.res = '* 命中。他的光晃了一下。';
        CHARS[0].heat = 1.0; G.white = 0.4; G.shake = 7;
        G.bossHurt = 0.6; G.st += 1.4;
        tone(240, 0.3, 'square', 0.06);
        burst(CHARS[0].x, CHARS[0].y, 16, CHARS[0].color, 180);
      } else {
        s.res = '* 落空。你打穿了空气。';
        G.st += 0.5;
      }
    }
  } else if (s.t > 0.9) {
    startBossTurn();
  }
  if (s.t > 6) { startBossTurn(); }
}

/* ============================================================
   场景逻辑
   ============================================================ */
function sceneNow(){ return SCENES[G.scene]; }

function enterScene(sc){
  var i;
  if (!G.seen) { G.seen = []; }
  if (G.seen[G.seen.length - 1] !== sc.id) { G.seen.push(sc.id); }
  G.lineIdx = -1; G.lineShown = 0; G.patCount = 0;
  G.pat = null; clearField(); G.msg = ''; G.msgT = 0;
  G.soul.mode = 'red'; G.soul.x = G.box.x + G.box.w / 2; G.soul.y = G.box.y + G.box.h / 2;
  G.soul.vx = 0; G.soul.vy = 0; G.soul.face = 'up'; G.soul.onGround = false;

  if (sc.id === 'title') {
    musicSet(false); G.white = 0.6;
  } else if (sc.id === 'pre') {
    musicSet(false);
  } else if (sc.id === 'p1') {
    CHARS[0].on = true; CHARS[0].alive = true;
    msgSet('* 夏立昕：传奇存在   ——   战斗开始');
    G.white = 0.8;
    startBossTurn();
  } else if (sc.id === 'p1c') {
    msgSet('* 他的动作变快了。骨列开始密集。');
    G.white = 0.7; G.shake = 8;
    startBossTurn();
  } else if (sc.id === 'story') {
    musicSet(false); G.white = 0.35;
  } else if (sc.id === 'p2') {
    CHARS[1].on = true; CHARS[1].alive = true;
    msgSet(LINES.p2in[0].s);
    G.white = 1; G.shake = 10;
    burst(CHARS[1].x, CHARS[1].y, 34, CHARS[1].color, 240);
    startBossTurn();
  } else if (sc.id === 'p3') {
    CHARS[2].on = true; CHARS[2].alive = true;
    msgSet(LINES.p3in[0].s);
    G.white = 1; G.shake = 12;
    burst(CHARS[2].x, CHARS[2].y, 34, CHARS[2].color, 240);
    startBossTurn();
  } else if (sc.id === 'silence') {
    musicSet(false); G.white = 0.25;
  } else if (sc.id === 'p4') {
    msgSet(LINES.p4in[0].s);
    G.white = 0.5;
    startBossTurn();
  } else if (sc.id === 'credits') {
    G.creditY = 520;
    musicSet(true, 0.3, 132, SEQ2);
  } else if (sc.id === 'heart') {
    musicSet(false); G.heartT = 0;
  }
  for (i = 0; i < CHARS.length; i++) {
    if (CHARS[i].alive && !CHARS[i].on) {
      /* 保持该阶段的可见角色集合 */
      var want = sc.chars && sc.chars.indexOf && sc.chars.indexOf(i) >= 0;
      if (want) { CHARS[i].on = true; }
    }
  }
  if (sc.chars) {
    for (i = 0; i < CHARS.length; i++) {
      if (CHARS[i].alive && sc.chars.indexOf(i) < 0) { CHARS[i].on = false; }
    }
  } else if (sc.id === 'pre' || sc.id === 'title' || sc.id === 'credits') {
    for (i = 0; i < CHARS.length; i++) { CHARS[i].on = false; }
  }
}

function exitScene(sc){
  if (sc.id === 'p4') {
    for (var i = 0; i < CHARS.length; i++) {
      if (CHARS[i].on) { shatterChar(i); }
    }
    G.win = true;
  }
  if (sc.id === 'story') {
    CHARS[1].on = true; CHARS[1].alive = true;
  }
  clearField();
  if (G.pat && G.pat.def.teardown) { G.pat.def.teardown.call(G.pat.st); }
  G.pat = null;
  musicSet(false);
}

function nextScene(){
  exitScene(sceneNow());
  if (G.scene < SCENES.length - 1) { G.scene++; }
  G.st = 0;
  enterScene(sceneNow());
  if (AUTO) { document.title = 'AUTO scene=' + sceneNow().id + ' t=' + Math.round(G.total); }
}

function nonBattleStep(dt, sc){
  var list = LINES[sc.id], i;
  if (list) {
    var idx = -1;
    for (i = 0; i < list.length; i++) { if (G.st >= list[i].t) { idx = i; } }
    if (idx >= 0 && idx !== G.lineIdx) { G.lineIdx = idx; G.lineShown = 0; sfxBlip(); }
    if (G.lineIdx >= 0) { G.lineShown += dt * 44; }
    if (just('z') && G.lineIdx >= 0) { G.lineShown = 1e9; }
  }
  if (sc.id === 'heart') { G.heartT += dt * SPD; }
  if (sc.id === 'credits') { G.creditY -= dt * 26 * SPD; }
}

function battleStep(dt, sc){
  if (G.turn === 'boss') {
    updateSoul(dt);
    patternTick(dt);
    updateBullets(dt);
    updateBlasters(dt);
    updateSpears(dt);
    collide(dt);
  } else if (G.turn === 'player') {
    battleUpdatePlayer(dt);
  } else if (G.turn === 'slash') {
    slashTick(dt);
  }
  /* 业障（KR）缓慢扣血 */
  if (G.kr > 0 && !GOD) {
    G.kr = Math.max(0, G.kr - dt * 0.55);
    if (!LOCK) {
      G.hp -= dt * 0.55 * G.kr * 0.12;
      if (G.hp <= 0) { G.hp = 0; die(); }
    }
  }
}

function step(dt){
  G.total += dt; G.gt += dt;
  musicTick(dt);
  updateParts(dt);
  if (G.white > 0) { G.white = Math.max(0, G.white - dt * 2.2); }
  if (G.flash > 0) { G.flash = Math.max(0, G.flash - dt * 3.4); }
  if (G.shake > 0) { G.shake = Math.max(0, G.shake - dt * 26); }
  if (G.hurtT > 0) { G.hurtT -= dt; }
  if (G.msg) { G.msgT += dt; }
  if (CHARS[0].heat > 0) { CHARS[0].heat = Math.max(0, CHARS[0].heat - dt * 1.5); }
  if (CHARS[1].heat > 0) { CHARS[1].heat = Math.max(0, CHARS[1].heat - dt * 1.5); }
  if (CHARS[2].heat > 0) { CHARS[2].heat = Math.max(0, CHARS[2].heat - dt * 1.5); }

  if (window.Shell) {
    if (LOCK !== window.Shell.lockHP) { LOCK = window.Shell.lockHP; }
    if (muted !== window.Shell.muted) { muted = window.Shell.muted; }
  }
  if (just('m')) {
    muted = !muted;
    if (window.Shell) { window.Shell.setMuted(muted); }
  }
  if (just('l')) {
    LOCK = !LOCK;
    if (window.Shell) { window.Shell.setLock(LOCK); }
    tone(LOCK ? 680 : 300, 0.09, 'square', 0.045);
  }

  if (G.dead) {
    G.deadT = (G.deadT || 0) + dt;
    if (just('r')) { resetGame(); }
    return;
  }
  if (just('r') && !AUTO) { resetGame(); return; }

  var sc = sceneNow();
  G.st += dt * SPD;

  if (sc.id === 'p1' || sc.id === 'p1c' || sc.id === 'p2' || sc.id === 'p3' || sc.id === 'p4') {
    battleStep(dt, sc);
  } else {
    nonBattleStep(dt, sc);
  }
  if (G.scene < SCENES.length - 1 && G.st >= sc.dur) { nextScene(); }
  else if (G.scene === SCENES.length - 1 && G.st >= sc.dur + 2) {
    if (AUTO) { document.title = 'DONE ok win=' + (G.win ? 1 : 0) + ' hp=' + Math.round(G.hp) + ' total=' + Math.round(G.total); }
    else if (!G.__p3done) { G.__p3done = true; if (window.Shell && window.Shell.p3Finished) { window.Shell.p3Finished(); } }
  }
}

/* ============================================================
   绘制
   ============================================================ */
function txt(s, x, y, font, color, align, baseline){
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = baseline || 'alphabetic';
  ctx.fillText(s, x, y);
}

function wrapText(s, maxW, font){
  ctx.font = font;
  var lines = [], cur = '', i, ch;
  for (i = 0; i < s.length; i++) {
    ch = s.charAt(i);
    if (ch === '\n') { lines.push(cur); cur = ''; continue; }
    if (ctx.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch; }
    else { cur += ch; }
  }
  if (cur.length) { lines.push(cur); }
  return lines;
}

function drawBackdrop(sc, t){
  /* 纯黑底 + 轻微暗角 */
  ctx.fillStyle = '#000000';
  ctx.fillRect(-20, -20, W + 40, H + 40);

  if (sc.id === 'pre') {
    /* 审判大厅：金黄色调 + 立柱剪影 + 浮尘 */
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#150e02');
    g.addColorStop(0.5, '#33230a');
    g.addColorStop(1, '#0a0701');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    var i;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    for (i = 0; i < 6; i++) {
      var cx = 30 + i * 116;
      ctx.fillRect(cx, 40, 34, H - 90);
      ctx.fillRect(cx - 5, 30, 44, 14);
      ctx.fillRect(cx - 5, H - 60, 44, 12);
    }
    ctx.fillStyle = 'rgba(255,224,150,0.10)';
    ctx.fillRect(0, 0, W, 70);
    var j;
    for (j = 0; j < 40; j++) {
      var dx = ((j * 97) % W + t * (6 + (j % 5))) % W;
      var dy = ((j * 53) % 300 + t * (4 + (j % 3))) % 300 + 30;
      ctx.fillStyle = 'rgba(255,236,180,' + (0.12 + 0.1 * Math.sin(t * 2 + j)) + ')';
      ctx.fillRect(dx, dy, 2, 2);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, H - 70, W, 70);
    /* 两个深色剪影 */
    var sil = function(x, y, h){
      ctx.fillStyle = '#120c02';
      ctx.beginPath();
      ctx.arc(x, y - h * 0.82, h * 0.16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(x - h * 0.2, y - h * 0.66, h * 0.4, h * 0.66);
    };
    sil(250, H - 70, 150);
    sil(400, H - 70, 120);
  }
  if (sc.id === 'story' || sc.id === 'silence') {
    var g2 = ctx.createRadialGradient(W / 2, 200, 20, W / 2, 200, 420);
    g2.addColorStop(0, 'rgba(48,48,58,0.16)');
    g2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, W, H);
  }
  if (sc.id === 'credits') {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }
}

/* 三段发光文字 */
function drawChars(t){
  var i, c;
  for (i = 0; i < CHARS.length; i++) {
    c = CHARS[i];
    if (!c.on || !c.alive) { continue; }

    /* 外发光光环 */
    var halo = 0.10 + 0.08 * Math.sin(t * 1.6 + i * 2);
    var rg = ctx.createRadialGradient(c.x, c.y, 4, c.x, c.y, c.size * 3.4);
    rg.addColorStop(0, 'rgba(255,255,255,' + (halo * 0.9) + ')');
    rg.addColorStop(0.45, 'rgba(255,255,255,' + (halo * 0.25) + ')');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.size * 3.4, 0, Math.PI * 2);
    ctx.fill();

    var heat = clamp(c.heat, 0, 2);
    var size = c.size * (1 + 0.02 * Math.sin(t * 1.7 + i));

    ctx.save();
    ctx.font = 'bold ' + Math.round(size) + 'px ' + CN;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = clamp(0.74 + 0.26 * Math.sin(t * 2.2 + i * 1.7) + heat * 0.3, 0, 1);

    var jx = 0, jy = 0;
    if (heat > 0.05) { jx = rnd(-2, 2) * heat; jy = rnd(-2, 2) * heat; }
    else if (G.inten > 1.3) { jx = Math.sin(t * 30 + i) * (G.inten - 1.3) * 1.6; }

    ctx.shadowColor = c.glow;
    ctx.shadowBlur = 16 + 12 * heat + 8 * (G.inten - 1);
    ctx.lineWidth = 3;
    ctx.strokeStyle = c.glow;
    ctx.strokeText(c.txt, c.x + jx, c.y + jy);
    ctx.shadowBlur = 26 + 14 * heat;
    ctx.fillStyle = heat > 0.7 ? '#ffffff' : c.color;
    ctx.fillText(c.txt, c.x + jx, c.y + jy);
    ctx.restore();
  }
}

function drawRing(t){
  if (!CHARS[0].on || !CHARS[0].alive) { return; }
  ctx.save();
  ctx.strokeStyle = 'rgba(255,236,180,0.20)';
  var i;
  for (i = 0; i < 3; i++) {
    var r = 40 + i * 26 + 6 * Math.sin(t * 1.3 + i);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(CHARS[0].x, CHARS[0].y, r, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawArena(){
  var b = G.box;
  ctx.save();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.strokeRect(b.x - 0.5, b.y - 0.5, b.w + 1, b.h + 1);
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.restore();
}

function drawBullets(){
  var i, bl, b = G.box;
  for (i = 0; i < G.bullets.length; i++) {
    bl = G.bullets[i];
    if (bl.kind === 'pillar') {
      ctx.fillStyle = '#2f5c1e';
      ctx.fillRect(bl.x, bl.y, bl.w, bl.h);
      ctx.fillStyle = '#9adf6b';
      ctx.fillRect(bl.x, bl.y, bl.w, 6);
      ctx.fillStyle = '#6fbf3c';
      var k;
      for (k = 0; k < bl.h; k += 12) { ctx.fillRect(bl.x + 4, bl.y + k, bl.w - 8, 5); }
      continue;
    }
    if (bl.kind === 'skull') {
      var pl = 1 + 0.10 * Math.sin(G.total * 24);
      ctx.save();
      ctx.translate(bl.x + bl.w / 2, bl.y + bl.h / 2);
      ctx.shadowColor = '#cfe9ff'; ctx.shadowBlur = 12;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, 0, 9 * pl, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(-3.2, -2, 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(3.2, -2, 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(-1.6, 3, 3.2, 5);
      ctx.restore();
      continue;
    }
    if (bl.kind === 'blue')   { ctx.fillStyle = '#4aa8ff'; }
    else if (bl.kind === 'orange') { ctx.fillStyle = '#ff9b2e'; }
    else { ctx.fillStyle = bl.color; }
    ctx.fillRect(bl.x, bl.y, bl.w, bl.h);
    /* 骨头描边与关节 */
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = 1;
    ctx.strokeRect(bl.x + 0.5, bl.y + 0.5, bl.w - 1, bl.h - 1);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    if (bl.w >= bl.h) {
      var n = Math.floor(bl.w / 22);
      for (var j = 1; j < n; j++) { ctx.fillRect(bl.x + j * 22 - 1, bl.y + 1, 3, bl.h - 2); }
    } else {
      var m = Math.floor(bl.h / 22);
      for (var q = 1; q < m; q++) { ctx.fillRect(bl.x + 1, bl.y + q * 22 - 1, bl.w - 2, 3); }
    }
    if (bl.kind === 'blue' || bl.kind === 'orange') {
      ctx.save();
      ctx.shadowColor = bl.kind === 'blue' ? '#4aa8ff' : '#ff9b2e';
      ctx.shadowBlur = 12;
      ctx.fillRect(bl.x, bl.y, bl.w, bl.h);
      ctx.restore();
    }
  }
  /* 平台 */
  if (G.plats) {
    for (i = 0; i < G.plats.length; i++) {
      var p = G.plats[i];
      ctx.fillStyle = '#2f5c1e';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#9adf6b';
      var s;
      for (s = 0; s < p.w; s += 12) { ctx.fillRect(p.x + s, p.y, 7, 3); }
    }
  }
  /* 绿色格挡骨矛 */
  for (i = 0; i < G.spears.length; i++) {
    var sp = G.spears[i];
    ctx.save();
    ctx.fillStyle = '#e8e8e8';
    ctx.fillRect(sp.x, sp.y, sp.w, sp.h);
    ctx.restore();
  }
}

function drawBlasters(){
  var i, k;
  for (i = 0; i < G.blasters.length; i++) {
    k = G.blasters[i];
    var firing = (k.t >= k.charge);
    ctx.save();
    ctx.translate(k.x, k.y);
    ctx.rotate(k.ang);
    /* 光束 */
    if (firing) {
      var prog = clamp((k.t - k.charge) / k.fire, 0, 1);
      var alpha = prog < 0.25 ? prog / 0.25 : (1 - prog) / 0.75;
      ctx.globalAlpha = clamp(alpha, 0, 1);
      ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      ctx.lineWidth = 10 + 8 * Math.sin(k.t * 40);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(900, 0); ctx.stroke();
      ctx.strokeStyle = 'rgba(150,220,255,0.85)';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(900, 0); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    /* 骷髅头 */
    var pulse = firing ? 1 : 1 + 0.12 * Math.sin(k.t * 22);
    ctx.fillStyle = firing ? '#ffffff' : '#d8d8d8';
    ctx.beginPath();
    ctx.arc(0, 0, 15 * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(-5, -3, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -3, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(-3, 5, 6, 8);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-8, 14); ctx.lineTo(8, 14); ctx.stroke();
    if (!firing) {
      /* 蓄力方向预警线：前摇缩短，但保留可读的弹道提示（必须离开这条线） */
      var cp = clamp(k.t / k.charge, 0, 1);
      ctx.strokeStyle = 'rgba(255,110,110,' + (0.08 + 0.34 * cp) + ')';
      ctx.lineWidth = 1 + 2 * cp;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(900, 0); ctx.stroke();
      ctx.strokeStyle = 'rgba(140,220,255,' + (0.4 + 0.4 * Math.sin(k.t * 26)) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }
}

function drawSoul(){
  if (G.turn !== 'boss') { return; }
  var s = G.soul;
  var col = '#ff2b2b';
  if (s.mode === 'blue') { col = '#2b6bff'; }
  if (s.mode === 'green') { col = '#2bd44b'; }
  drawHeartShape(s.x, s.y, 9, col, G.hurtT > 0 ? 1 : 0);
  if (s.mode === 'green') {
    /* 面向指示 */
    var a = 0;
    if (s.face === 'right') { a = 0; }
    if (s.face === 'down')  { a = Math.PI / 2; }
    if (s.face === 'left')  { a = Math.PI; }
    if (s.face === 'up')    { a = -Math.PI / 2; }
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(a);
    ctx.strokeStyle = 'rgba(120,255,150,0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(13, 0); ctx.lineTo(24, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(24, 0); ctx.lineTo(20, -4); ctx.moveTo(24, 0); ctx.lineTo(20, 4); ctx.stroke();
    ctx.restore();
  }
}

function drawHeartShape(x, y, r, color, hurt){
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = hurt ? '#ffffff' : color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(0, r * 0.7);
  ctx.bezierCurveTo(-r * 1.5, -r * 0.35, -r * 0.6, -r * 1.35, 0, -r * 0.45);
  ctx.bezierCurveTo(r * 0.6, -r * 1.35, r * 1.5, -r * 0.35, 0, r * 0.7);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawParticles(){
  var i, p;
  for (i = 0; i < G.parts.length; i++) {
    p = G.parts[i];
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  for (i = 0; i < G.shards.length; i++) {
    p = G.shards[i];
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

/* 打字机文本（用于对话框与战斗盒） */
function drawTyped(s, x, y, maxW, font, lineH, align){
  var shown = s.substring(0, Math.floor(G.msgT * 44));
  if (shown.length > s.length) { shown = s; }
  var lines = wrapText(shown, maxW, font);
  var i;
  for (i = 0; i < lines.length; i++) {
    txt(lines[i], x, y + i * lineH, font, '#ffffff', align || 'left');
  }
}

function drawMsgInBox(){

function drawHUD(){

function drawTitle(){
  var t = G.gt;
  var x = W / 2, y = 150, w = 420, h = 120;
  ctx.save();
  ctx.strokeStyle = '#ff9d00';
  ctx.lineWidth = 4;
  ctx.shadowColor = '#ff9d00';
  ctx.shadowBlur = 18;
  ctx.strokeRect(x - w / 2, y - h / 2, w, h);
  ctx.restore();
  txt('传 说 之 下  ·  夏 立 昕  篇', x, y - 14, 'bold 26px ' + CN, '#ffd24d', 'center', 'middle');
  txt('BOSS 战 流 程 复 刻', x, y + 26, '16px ' + CN, '#ff9d00', 'center', 'middle');
  if (Math.sin(t * 3) > -0.3) {
    txt('按 Z 开始（跳过需等计时）', x, 400, '13px ' + CN, '#777777', 'center');
  }
}

function drawCredits(sc){
  var i;
  var lines = [
    '', '制作人员名单', '',
    '原作灵感：Undertale: Disbelief',
    '（FlamesAtGames）', '',
    '复刻实现：Marvis File Agent', '',
    '角色设定',
    '夏立昕：传奇存在',
    '夏立昕：不灭重生',
    '夏立昕：终焉末日', '',
    '骨骼弹幕 / 骷髅头光束 / 三态灵魂', '',
    '感谢观看',
    '这个故事，还没有结束'
  ];
  var font = 'bold 18px ' + CN;
  for (i = 0; i < lines.length; i++) {
    var yy = G.creditY + i * 30;
    if (yy < -20 || yy > H + 20) { continue; }
    txt(lines[i], W / 2, yy, font, i === 1 ? '#ffd24d' : '#dddddd', 'center');
  }
}

function drawHeartEnd(sc){
  var t = G.heartT;
  var a = clamp(1, 0, 1);
  ctx.globalAlpha = 1;
  if (t < 1.2) { ctx.globalAlpha = clamp(t / 1.2, 0, 1); }
  drawHeartShape(W / 2, H / 2 - 30, 26 + 2 * Math.sin(t * 2), '#ff2b2b', 0);
  ctx.globalAlpha = 1;
  if (t > 4.5) {
    ctx.fillStyle = 'rgba(0,0,0,' + clamp((t - 4.5) / 3, 0, 1) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (t > 3.2 && t < 5.4) {
    txt('夏立昕：传奇存在 / 不灭重生 / 终焉末日', W / 2, 380, 'bold 17px ' + CN, '#ffd24d', 'center');
  }
}

function drawWhite(){
  if (G.white > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + clamp(G.white, 0, 1) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (G.flash > 0) {
    ctx.fillStyle = 'rgba(255,80,80,' + clamp(G.flash * 0.5, 0, 0.5) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

function drawDead(){
  if (!G.dead) { return; }
  ctx.fillStyle = 'rgba(0,0,0,0.82)';
  ctx.fillRect(0, 0, W, H);
  txt('GAME  OVER', W / 2, 190, 'bold 40px ' + CN, '#ffffff', 'center', 'middle');
  txt('你输了。但"传奇存在"从不只出现一次。', W / 2, 246, '15px ' + CN, '#bbbbbb', 'center', 'middle');
  txt('按 R 重新开始', W / 2, 300, 'bold 18px ' + CN, '#ffd24d', 'center', 'middle');
}

/* 锁血状态指示牌（常驻右上角，L 键切换） */
function drawLockBadge(){
  var s = LOCK ? '锁血 ON' : '锁血 OFF';
  var col = LOCK ? '#7dffb0' : '#5f5f5f';
  var font = 'bold 13px ' + CN;
  ctx.save();
  ctx.font = font;
  var tw = ctx.measureText(s).width;
  var kw = ctx.measureText('[L]').width;
  var w = tw + kw + 30, h = 24, x = W - w - 10, y = 10;
  ctx.fillStyle = LOCK ? 'rgba(8,32,20,0.85)' : 'rgba(16,16,16,0.72)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = col;
  ctx.lineWidth = 2;
  ctx.shadowColor = col;
  ctx.shadowBlur = LOCK ? 10 : 0;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = col;
  ctx.fillText(s, x + 10, y + h / 2 + 1);
  ctx.fillStyle = LOCK ? '#eafff2' : '#808080';
  ctx.fillText('[L]', x + 10 + tw + 10, y + h / 2 + 1);
  ctx.restore();
}

function render(){
  var sc = sceneNow();
  var t = G.gt;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, W, H);

  var sx = 0, sy = 0;
  if (G.shake > 0.4) {
    sx = rnd(-G.shake, G.shake) * 0.5;
    sy = rnd(-G.shake, G.shake) * 0.5;
  }
  ctx.save();
  ctx.translate(sx, sy);

  drawBackdrop(sc, t);

  var battling = (sc.id === 'p1' || sc.id === 'p1c' || sc.id === 'p2' ||
                  sc.id === 'p3' || sc.id === 'p4');

  if (sc.id === 'title') { drawTitle(); }

  if (battling) {
    drawRing(t);
    drawChars(t);
    drawArena();
    drawBullets();
    drawBlasters();
    drawSoul();
    if (G.turn === 'player' || G.turn === 'slash') { drawMsgInBox(); }
    drawSlash();
  } else if (sc.id === 'story' || sc.id === 'silence' || sc.id === 'pre' || sc.id === 'credits') {
    drawChars(t);
  } else if (sc.id === 'heart') {
    drawHeartEnd(sc);
  }

  drawParticles();

  if (battling) { drawHUD(); }
  if (sc.id !== 'heart' && sc.id !== 'credits') { drawDialogue(sc); }
  if (sc.id === 'credits') { drawCredits(sc); }

  ctx.restore();

  drawWhite();
  drawDead();
  drawLockBadge();

  if (AUTO && !NODBG) {
    var F = 'bold 17px ' + MONO;
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, 0, W, 132);
    txt('AUTO ' + sc.id + ' st=' + G.st.toFixed(2) + ' tot=' + Math.round(G.total) + ' fr=' + frames,
        6, 18, F, '#00ff88');
    txt('hp=' + Math.round(G.hp) + ' dead=' + (G.dead ? 1 : 0) + ' turn=' + G.turn +
        ' int=' + G.inten.toFixed(2) + ' soul=' + G.soul.mode + ' lock=' + (LOCK ? 1 : 0), 6, 38, F, '#00ff88');
    txt('bul=' + G.bullets.length + ' bl=' + G.blasters.length + ' sp=' + G.spears.length +
        ' plat=' + (G.plats ? G.plats.length : 0) + ' msg=' + (G.msg ? 1 : 0), 6, 58, F, '#00ff88');
    txt('pat=' + (G.pat ? (G.pat.name + ' ' + G.pat.st.t.toFixed(1) + '/' + G.pat.dur) : 'none') +
        ' probe=' + probe, 6, 78, F, '#88ffcc');
    txt('seen=' + (G.seen ? G.seen.join('>') : ''), 6, 98, 'bold 13px ' + MONO, '#88ffcc');
    if (lastErr) {
      ctx.fillStyle = 'rgba(40,0,0,0.92)';
      ctx.fillRect(0, 104, W, 66);
      var el = wrapText(lastErr, W - 12, 'bold 15px ' + MONO);
      for (var li = 0; li < el.length && li < 3; li++) {
        txt(el[li], 6, 124 + li * 19, 'bold 15px ' + MONO, '#ff5555');
      }
    }
  }
}




/* ============================================================
   自动化演练（仅 #auto / #auto2 触发，正常双击运行不受影响）
   ============================================================ */
var AUTO2 = (location.hash.indexOf('auto2') >= 0);
if (AUTO2) { AUTO = true; SPD = 0.05; }
if (AUTO && !AUTO2) { GOD = true; }
var autoT = 0, autoDeadMark = 0;

function autoDrive(dt){
  autoT -= dt;
  if (autoT > 0) { return; }
  autoT = AUTO2 ? 0.34 : 0.16;
  keys.up = false; keys.down = false; keys.left = false; keys.right = false;
  var r = Math.random();
  if (AUTO2) {
    /* 故意不动，用于触发受伤与死亡分支 */
  } else if (r < 0.34) { keys.left = true; }
  else if (r < 0.68) { keys.right = true; }
  else if (r < 0.82) { keys.up = true; }
  else if (r < 0.94) { keys.down = true; }
  if (Math.random() < (AUTO2 ? 0.25 : 0.4)) { pressed['z'] = true; }
  if (Math.random() < 0.12) { pressed['x'] = true; }
  if (G.dead && AUTO2 && !autoDeadMark) {
    autoDeadMark = 1;
    document.title = 'AUTODEATH ok hp=' + Math.round(G.hp);
  }
}

/* ============================================================
   主循环
   ============================================================ */
var lastTs = 0, frames = 0, frame2s = 0, frozen = false;

function frame(ts){
  /* 由"三战合一"外壳调度：非第三战阶段挂起 */
  if (!window.Shell || !window.Shell.active(3)) { lastTs = ts; requestAnimationFrame(frame); return; }
  var dt;
  if (!lastTs) { dt = 0.016; } else { dt = (ts - lastTs) / 1000; }
  lastTs = ts;
  if (!(dt > 0)) { dt = 0.016; }
  if (dt > 0.06) { dt = 0.06; }

  if (!frozen) {
    if (AUTO) { autoDrive(dt); }
    step(dt);
    clearPressed();
  }
  render();

  frames++;
  frame2s++;
  if (frames === 2 && !AUTO) { document.title = 'OK 夏立昕BOSS战'; }
  if (frames % 600 === 0 && AUTO && document.title.indexOf('ERR') === 0) {
    /* 保持错误标记 */
  }
  requestAnimationFrame(frame);
}

/* ============================================================
   启动
   ============================================================ */
function startGame(){
  resetGame();
  G.__p3done = false;
  lastTs = 0; frames = 0; frame2s = 0; frozen = false;
  keys = {}; clearPressed();
  try {
    enterScene(SCENES[0]);
    var ski = location.hash.match(/skip=([0-9]+)/);
    if (ski && !AUTO) {
      var kk = Math.min(parseInt(ski[1], 10), SCENES.length - 1);
      G.scene = kk;
      enterScene(SCENES[kk]);
      G.st = 0;
    }
    if (AUTO2) { G.hp = 6; }
    if (window.Shell) { LOCK = window.Shell.lockHP; if (location.hash.indexOf('lock') >= 0) { window.Shell.setLock(true); } }
    document.title = 'OK boot';
  } catch (e) {
    document.title = 'ERR: boot ' + e.message;
    errBox.style.display = 'block';
    errBox.textContent = 'BOOT ERROR: ' + e.message;
  }
}

if (AUTO) {
  /* 自检驱动：同步推演到目标场景（#auto&until=p1c / #auto&until=end） */
  var mm = location.hash.match(/until=([A-Za-z0-9]*)(?::([0-9.]+))?/);
  var untilId = mm ? mm[1] : (AUTO2 ? 'dead' : '');
  var untilSec = (mm && mm[2]) ? parseFloat(mm[2]) : 0.9;
  var pm = location.hash.match(/probe=([a-z]+)/);
  var probe = pm ? pm[1] : '';
  var pmn = location.hash.match(/pmin=([0-9.]+)/);
  var pmin = pmn ? parseFloat(pmn[1]) : 0;
  function hasKind(k){
    for (var q = 0; q < G.bullets.length; q++) {
      if (G.bullets[q].kind === k) { return true; }
    }
    return false;
  }
  var guard = 0, scNow;
  try {
    while (guard < 300000) {
      guard++;
      autoDrive(0.0167);
      step(0.0167);
      clearPressed();
      if (G.dead) { break; }
      scNow = sceneNow();
      if (G.scene >= SCENES.length - 1 && G.st > 9) { break; }
      var ptime = G.pat ? G.pat.st.t : 999;
      if (probe && scNow.id === untilId && ptime >= pmin) {
        if (probe === 'bul' && G.bullets.length > 0) { break; }
        if (probe === 'bl' && G.blasters.length > 0) { break; }
        if (probe === 'sp' && G.spears.length > 0) { break; }
        if (probe === 'blue' && hasKind('blue')) { break; }
        if (probe === 'orange' && hasKind('orange')) { break; }
        if (probe === 'plat' && G.plats && G.plats.length > 0) { break; }
        if (probe === 'green' && G.soul.mode === 'green') { break; }
        if (probe === 'flash' && G.white > 0.5) { break; }
      }
      if (!probe && untilId && untilId !== 'end' && scNow.id === untilId && G.st > untilSec) { break; }
      if (probe && guard > 200000) { break; }
    }
    frames = guard;
    frozen = true;
    document.title = 'OK sim ' + sceneNow().id + ' steps=' + guard +
                     ' hp=' + Math.round(G.hp) + ' dead=' + (G.dead ? 1 : 0) +
                     ' lock=' + (LOCK ? 1 : 0);
  } catch (e) {
    document.title = 'ERR: sim ' + e.message;
    errBox.style.display = 'block';
    errBox.textContent = 'SIM ERROR: ' + e.message + ' | scene=' + sceneNow().id;
  }
  try { render(); } catch (e) {
    document.title = 'ERR: render ' + e.message;
    errBox.style.display = 'block';
    errBox.textContent = 'RENDER ERROR: ' + e.message;
  }
} else {
  requestAnimationFrame(frame);
}

window.Shell = window.Shell || {};
window.Shell.m3 = {
  start: function(){ try { startGame(); } catch (err) { console.error('[Battle3] start failed:', err); } },
  setMuted: function(m){ try { muted = !!m; } catch (e) {} },
  stats: function(){ return { hp: (G ? G.hp : 0), maxhp: (G ? G.maxhp : 78), win: !!(G && G.win) }; }
};

})();
</script>
