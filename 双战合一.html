<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>双战合一 —— 帝国之影 · 审判走廊</title>
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#fff}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center}
  #wrap{width:640px;height:480px;position:relative;box-shadow:0 0 40px #200;flex:none}
  #wrap canvas{position:absolute;left:0;top:0;width:640px;height:480px;image-rendering:pixelated;background:#000;display:none}
  #wrap[data-stage="p1"] #game{display:block}
  #wrap[data-stage="p2"] #cv{display:block}
  #overlay{position:absolute;left:0;top:0;width:640px;height:480px;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;padding:26px;user-select:none}
  #wrap[data-stage="title"] #overlay,
  #wrap[data-stage="final"] #overlay{display:flex}
  .ttl{font-weight:bold;letter-spacing:4px}
  .glow{text-shadow:0 0 18px currentColor,0 0 5px currentColor}
  .sub{color:#888;font-size:15px;letter-spacing:2px;margin-top:10px}
  .keys{color:#ccc;font-size:14px;line-height:1.95;margin-top:16px}
  .keys b{color:#ffff38}
  .key2{color:#8f8}
  .btn{display:inline-block;margin-top:22px;padding:8px 30px;border:2px solid #ff7f27;color:#ff7f27;border-radius:6px;letter-spacing:3px;cursor:pointer;font:bold 16px "Microsoft YaHei",sans-serif;background:rgba(0,0,0,.6);user-select:none}
  .btn:hover{color:#ffff38;border-color:#ffff38;box-shadow:0 0 14px rgba(255,255,56,.35)}
  .stat{margin-top:8px;color:#ddd;font-size:15px;line-height:1.9}
  .stat b{color:#fff}
  .pulse{animation:pl 1.1s ease-in-out infinite}
  @keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}
  #bottomBar{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:12px;flex:none}
  #hint{color:#666;font-size:13px;letter-spacing:1px;text-align:center}
  #lockBtn{padding:6px 20px;font:bold 15px "Microsoft YaHei",sans-serif;color:#ffe000;background:#1a0000;border:2px solid #ff4040;border-radius:6px;cursor:pointer;letter-spacing:2px}
  #lockBtn.on{color:#00ff88;border-color:#00ff88;box-shadow:0 0 12px rgba(0,255,136,.4)}
  #lockBtn:hover{filter:brightness(1.3)}
  #err{position:fixed;left:4px;top:4px;color:#ff5555;font:12px/1.5 Consolas,monospace;background:rgba(0,0,0,.85);border:1px solid #600;padding:6px 10px;max-width:620px;white-space:pre-wrap;display:none;z-index:99}
</style>
</head>
<body>
<div id="wrap" data-stage="title">
  <canvas id="game" width="640" height="480"></canvas>
  <canvas id="cv" width="640" height="480"></canvas>
  <div id="overlay"><div id="ovBody"></div></div>
</div>
<div id="bottomBar">
  <div id="hint">方向键/WASD 移动 · Z/Enter 确认 · X/Shift 取消/慢速 · R 防御 · E 回血 · M 静音 · L 锁血</div>
  <button id="lockBtn" type="button">🔒 锁血：关（按 L 或点此开启）</button>
</div>
<div id="err"></div>

<script>
/* ================= 外壳：统一标题 / 关卡衔接 / 结算 / 输入 / 锁血 ================= */
"use strict";
(function(){
const wrap=document.getElementById('wrap');
const overlay=document.getElementById('overlay');
const ovBody=document.getElementById('ovBody');
const lockBtn=document.getElementById('lockBtn');

function fmtT(ms){ms=Math.max(0,ms||0);const s=Math.floor(ms/1000);return Math.floor(s/60)+' 分 '+(s%60)+' 秒';}

const Shell={
  lockHP:false,muted:false,stage:'title',
  t1s:0,t1e:0,t2s:0,t2e:0,p1stats:null,p2stats:null,
  active(id){return (id===1&&this.stage==='p1')||(id===2&&this.stage==='p2');},
  setStage(s){this.stage=s;wrap.setAttribute('data-stage',s);this.renderOverlay();},
  setLock(v){
    this.lockHP=!!v;
    lockBtn.textContent=this.lockHP?'🔒 锁血：开（无敌中，按 L 或点此关闭）':'🔒 锁血：关（按 L 或点此开启）';
    lockBtn.classList.toggle('on',this.lockHP);
  },
  setMuted(m){
    this.muted=!!m;
    if(window.Shell.m1)window.Shell.m1.setMuted(this.muted);
    if(window.Shell.m2)window.Shell.m2.setMuted(this.muted);
  },
  startP1(){this.t1s=performance.now();this.setStage('p1');if(window.Shell.m1)window.Shell.m1.start();},
  p1Finished(){
    this.t1e=performance.now();
    this.p1stats=(window.Shell.m1&&window.Shell.m1.stats)?window.Shell.m1.stats():null;
    this.startP2();   /* 无缝衔接：第一战胜利结算后不再插入过场，直接进入第二战 */
  },
  startP2(){
    this.t2s=performance.now();
    this.setStage('p2');
    const hp=(this.p1stats&&typeof this.p1stats.hp==='number')?this.p1stats.hp:null;
    if(window.Shell.m2)window.Shell.m2.start(hp);
  },
  p2Finished(){
    this.t2e=performance.now();
    this.p2stats=(window.Shell.m2&&window.Shell.m2.stats)?window.Shell.m2.stats():null;
    this.setStage('final');
  },
  renderOverlay(){
    const s=this.stage;
    if(s==='title'){
      ovBody.innerHTML=
        '<div class="ttl glow" style="font-size:40px;color:#ff2a2a">双战合一</div>'+
        '<div class="ttl glow" style="font-size:20px;color:#ff9c30;margin-top:14px">帝国之影 &times; 审判走廊</div>'+
        '<div class="sub">两场战斗 · 连续进行 · 一镜到底</div>'+
        '<div class="keys">方向键 / W A S D　移动<br>'+
        '<b>Z / Enter</b>　确认　　<b>X / Shift</b>　取消 / 慢速<br>'+
        '战斗中：<b>R</b> 防御　<b>E</b> 快速回血　<b>M</b> 静音<br>'+
        '<span class="key2">L 或下方按钮：锁血（无敌，再按取消）</span></div>'+
        '<div class="btn pulse">按 Z 开始第一战</div>';
    }else if(s==='final'){
      const a=this.p1stats||{hits:0,deaths:0,dmg:0};
      const b=this.p2stats||{hp:'-',maxhp:'-'};
      ovBody.innerHTML=
        '<div class="ttl glow" style="font-size:34px;color:#ffd24a">双 战 · 落 幕</div>'+
        '<div class="stat" style="margin-top:18px">第一战　帝国之影：受击 '+a.hits+' 次　倒下 '+a.deaths+' 次　斩影值 '+a.dmg+'</div>'+
        '<div class="stat">第二战　审判走廊：剩余 HP '+b.hp+' / '+b.maxhp+'</div>'+
        '<div class="stat">总用时 <b>'+fmtT(this.t2e-this.t1s)+'</b></div>'+
        '<div class="keys" style="margin-top:16px">两场黄昏，你都打完了。<br>感谢游玩。</div>'+
        '<div class="btn pulse">按 Z 再来一局</div>';
    }else{
      ovBody.innerHTML='';
    }
  }
};
window.Shell=Shell;

function confirmAction(){
  if(Shell.stage==='title')Shell.startP1();
  else if(Shell.stage==='final')location.reload();
}
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  if(e.repeat)return;
  if(e.code==='KeyL'){e.preventDefault();Shell.setLock(!Shell.lockHP);return;}
  if(e.code==='KeyM'){e.preventDefault();Shell.setMuted(!Shell.muted);return;}
  if(e.code==='KeyZ'||e.code==='Enter'){
    if(Shell.stage==='title'||Shell.stage==='final'){
      e.preventDefault();e.stopImmediatePropagation();confirmAction();
    }
  }
});
overlay.addEventListener('click',()=>{
  if(Shell.stage==='title'||Shell.stage==='final')confirmAction();
});
lockBtn.addEventListener('click',()=>{Shell.setLock(!Shell.lockHP);lockBtn.blur();});

Shell.setLock(false);
Shell.renderOverlay();
})();
</script>

<script>

;(function(){
"use strict";

"use strict";
window.onerror=function(msg,src,line){const d=document.getElementById('err');d.style.display='block';d.textContent+='[ERR] '+msg+' @'+line+'\n';};

/* ================= 基础 ================= */
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const W=640,H=480,TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const midiF=m=>440*Math.pow(2,(m-69)/12);

/* ================= 音频 ================= */
const AudioSys={
  ac:null,sfx:null,mus:null,muted:false,noiseBuf:null,
  ensure(){
    if(!this.ac){
      this.ac=new (window.AudioContext||window.webkitAudioContext)();
      this.sfx=this.ac.createGain();this.sfx.gain.value=.5;this.sfx.connect(this.ac.destination);
      this.mus=this.ac.createGain();this.mus.gain.value=.3;this.mus.connect(this.ac.destination);
      const len=this.ac.sampleRate*0.5,buf=this.ac.createBuffer(1,len,this.ac.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      this.noiseBuf=buf;
    }
    if(this.ac.state==='suspended')this.ac.resume();
  },
  tone(f,dur,type,vol,slide,delay,dest){
    if(this.muted||!this.ac)return;
    const t=this.ac.currentTime+(delay||0),o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(dest||this.sfx);o.start(t);o.stop(t+dur+.05);
  },
  noise(dur,vol,delay,dest){
    if(this.muted||!this.ac)return;
    const t=this.ac.currentTime+(delay||0),s=this.ac.createBufferSource(),g=this.ac.createGain();
    s.buffer=this.noiseBuf;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(g);g.connect(dest||this.sfx);s.start(t);s.stop(t+dur+.05);
  },
  text(){this.tone(620,.045,'square',.09)},
  move(){this.tone(500,.05,'square',.11)},
  select(){this.tone(880,.07,'square',.14)},
  hurt(){this.tone(160,.28,'sawtooth',.3,-120);this.noise(.16,.22)},
  slash(){this.noise(.13,.3);this.tone(950,.09,'sawtooth',.14,-600)},
  blast(){this.tone(110,.45,'sawtooth',.32,320);this.noise(.35,.26)},
  heal(){this.tone(520,.1,'sine',.2);this.tone(784,.14,'sine',.2,0,.09)},
  down(){this.tone(220,.7,'sawtooth',.3,-180);this.noise(.55,.3)},
  phase(){this.tone(90,1.1,'sawtooth',.35,220);this.noise(.9,.3);this.tone(1200,.4,'square',.12,-900,.1)},
  defend(){this.tone(300,.08,'triangle',.12)}
};

/* ---- 简易音乐序列器 ---- */
const Music={
  name:null,t0:0,i:0,
  seqs:{
    p1:{bpm:132,len:8,notes:(()=>{const n=[];
      const bass=[45,45,45,45,41,41,43,43];
      for(let b=0;b<8;b++){n.push([b,bass[b],.24,'square',.20]);n.push([b+.5,bass[b],.22,'square',.14]);}
      const mel=[[0,76,.45],[.5,72,.45],[1,69,.9],[2,72,.45],[2.5,76,.45],[3,79,.9],[4,81,.45],[4.5,79,.45],[5,76,.9],[6,74,.45],[6.5,72,.45],[7,71,.9]];
      for(const m of mel)n.push([m[0],m[1],m[2],'triangle',.22]);
      for(let b=0;b<16;b++)n.push([b*.5,null,.03,'hat',.05]);
      n.sort((a,b)=>a[0]-b[0]);return n;})()},
    p2:{bpm:170,len:8,notes:(()=>{const n=[];
      const bass=[50,50,50,50,46,46,48,48];
      for(let b=0;b<8;b++){n.push([b,bass[b],.2,'sawtooth',.17]);n.push([b+.5,bass[b]+12,.18,'square',.10]);}
      const mel=[[0,74,.4],[.5,77,.4],[1,81,.4],[1.5,77,.4],[2,74,.8],[3,72,.4],[3.5,74,.4],[4,77,.4],[4.5,81,.4],[5,84,.4],[5.5,81,.4],[6,79,.8],[7,77,.4],[7.5,74,.4]];
      for(const m of mel)n.push([m[0],m[1],m[2],'square',.14]);
      for(let b=0;b<16;b++)n.push([b*.5,null,.03,'hat',.07]);
      n.sort((a,b)=>a[0]-b[0]);return n;})()}
  },
  start(name){this.name=name;this.t0=0;this.i=0;},
  stop(){this.name=null;},
  tick(){
    if(!this.name||AudioSys.muted||!AudioSys.ac)return;
    const seq=this.seqs[this.name],spb=60/seq.bpm,now=AudioSys.ac.currentTime;
    if(!this.t0||this.t0<now-0.5){this.t0=now+.1;this.i=0;}
    let guard=0;
    while(guard++<64){
      const nt=seq.notes[this.i],t=this.t0+nt[0]*spb;
      if(t>now+.3)break;
      if(nt[3]==='hat'){AudioSys.noise(nt[2],nt[4],t-now,AudioSys.mus);}
      else AudioSys.tone(midiF(nt[1]),nt[2],nt[3],nt[4],0,t-now,AudioSys.mus);
      this.i++;if(this.i>=seq.notes.length){this.i=0;this.t0+=seq.len*spb;}
    }
  }
};
Music.muted=false;

/* ================= 锁血 ================= */
let LOCKHP=false;
const lockBtn=document.getElementById('lockBtn');
function setLock(v){
  LOCKHP=v;
  window.Shell.setLock(v);
}

/* ================= 输入 ================= */
const keys={},pressed={};
addEventListener('keydown',e=>{
  if(!window.Shell.active(1))return;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  if(!keys[e.code])pressed[e.code]=true;
  keys[e.code]=true;
  AudioSys.ensure();
  if(e.code==='KeyE')quickHeal();
});
addEventListener('keyup',e=>{if(!window.Shell.active(1))return;keys[e.code]=false;});
const P=(...c)=>c.some(k=>pressed[k]);
const D=(...c)=>c.some(k=>keys[k]);
const isConfirm=()=>P('KeyZ','Enter');
const isCancel=()=>P('KeyX','ShiftLeft','ShiftRight');

/* ================= 绘制辅助 ================= */
function glowText(txt,x,y,size,color,glow,glowColor,align,baseline){
  ctx.save();
  ctx.font='bold '+size+'px "Microsoft YaHei","PingFang SC",sans-serif';
  ctx.textAlign=align||'center';ctx.textBaseline=baseline||'middle';
  if(glow){
    ctx.shadowColor=glowColor||color;ctx.shadowBlur=Math.min(glow,size*0.45);
    ctx.globalAlpha=.8;ctx.fillStyle=color;ctx.fillText(txt,x,y);
  }
  ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.fillStyle=color;
  ctx.fillText(txt,x,y);ctx.fillText(txt,x,y);
  ctx.restore();
}
function smallText(txt,x,y,size,color,align){
  ctx.save();ctx.font=size+'px "Microsoft YaHei",sans-serif';
  ctx.textAlign=align||'left';ctx.textBaseline='middle';ctx.fillStyle=color;
  ctx.fillText(txt,x,y);ctx.restore();
}
function drawHeart(x,y,color,scale){
  ctx.save();ctx.translate(x,y);ctx.scale(scale||1,scale||1);
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(0,6);ctx.lineTo(-6,0);ctx.arc(-3,-3,4.3,Math.PI,0,false);
  ctx.arc(3,-3,4.3,Math.PI,0,false);ctx.lineTo(0,6);
  ctx.fill();ctx.restore();
}
function wrapText(txt,maxW,font){
  ctx.save();ctx.font=font;const out=[];
  for(const seg of txt.split('\n')){
    let line='';
    for(const ch of seg){
      if(ctx.measureText(line+ch).width>maxW&&line){out.push(line);line=ch;}
      else line+=ch;
    }
    out.push(line);
  }
  ctx.restore();return out;
}

/* ================= 全局状态 ================= */
let state='title',time=0,frame=0,shake=0,flashA=0,flashC='#fff';
let bullets=[],blasters=[],particles=[],popups=[],slashes=[];
let bannerTxt='',bannerT=0;
let startTime=0,hitsTaken=0,deaths=0,dmgDealt=0,clearedTime=0;

const BOARD={x:75,y:245,w:490,h:130,tx:75,ty:245,tw:490,th:130};
function setBoard(x,y,w,h){BOARD.tx=x;BOARD.ty=y;BOARD.tw=w;BOARD.th=h;}
function boardLerp(){
  BOARD.x=lerp(BOARD.x,BOARD.tx,.22);BOARD.y=lerp(BOARD.y,BOARD.ty,.22);
  BOARD.w=lerp(BOARD.w,BOARD.tw,.22);BOARD.h=lerp(BOARD.h,BOARD.th,.22);
}
const SOUL={x:320,y:310,hp:92,maxhp:92,mode:'red',vy:0,onGround:false,inv:0,defMeter:100};
function quickHeal(){
  if(items>0&&SOUL.hp<SOUL.maxhp&&(state==='dodge'||state==='menu')){
    items--;SOUL.hp=Math.min(SOUL.maxhp,SOUL.hp+60);
    AudioSys.heal();popups.push({x:SOUL.x,y:SOUL.y-20,txt:'+60',c:'#3fda64',t:0,vy:-.7});

}

/* ================= BOSS（三段发光文字） ================= */
const BOSSES=[
  {label:'影·壹',color:'#ff4040',hp1:380,hp2:460,x:135,y:112},
  {label:'影·贰',color:'#ff9c30',hp1:420,hp2:520,x:320,y:100},

}
const CHECKS=[
  '* 马亦宸：帝国之影·壹\n* 攻击 9  防御 9\n* 藏在你身后第一步的那个影子。',
  '* 马亦宸：帝国之影·贰\n* 攻击 11  防御 7\n* 斧刃，比笑容更诚实。',
  '* 马亦宸：帝国之影·叁\n* 攻击 10  防御 8\n* 每一把刀，都是一次告别。',

/* ================= 剧本 ================= */
const INTRO=[
  '……你又来了。',
  '人类。不——你已经不能算人类了。',
  '帝国的黄昏里，影子记得每一笔账。',

const P1_MID=['* 影·贰：别停下。\n* 停下来的东西，都会变成碎片。'];
const P1_END=[

const P2_MID=['* 影·贰：巨骨与刀锋，都是帝国的标点。'];

  '* 影子在低语。','* 空气粘稠如血。','* 你闻到了铁锈的味道。',
  '* 三道影子注视着你。','* 刀锋的反光一闪而过。','* 地面微微地震颤。',

  '* 影，拒绝了你的仁慈。','* 影子没有接受饶恕的缝隙。','* 它们摇头。影子不原谅。',
];
const script=[
  {dlg:INTRO},
  {turn:{boss:0,dur:9.5,soul:'red', pat:'m_bones',    banner:'影·壹 的回合'}},
  {dlg:['* 影·壹：第一刀，只是问候。']},
  {turn:{boss:1,dur:9.5,soul:'red', pat:'h_cleavers', banner:'影·贰 的回合'}},
  {turn:{boss:2,dur:9.5,soul:'red', pat:'k_knives',   banner:'影·叁 的回合'}},
  {dlg:P1_MID},
  {turn:{boss:0,dur:11, soul:'blue',pat:'m_blasters', banner:'影·壹 的回合 · 重力'}},
  {turn:{boss:1,dur:10, soul:'red', pat:'h_bones_mix',banner:'影·贰 的回合'}},
  {turn:{boss:2,dur:11, soul:'red', pat:'k_rain',     banner:'影·叁 的回合 · 刀雨'}},
  {dlg:P1_END},
  {mark:'phase2'},

let pc=0,phase=1,pendingTurn=null,items=3,phase2Idx=0,phaseStartSnap=null;
script.forEach((op,i)=>{if(op.mark==='phase2')phase2Idx=i;});

function snapshot(){
  phaseStartSnap={pc,phase,items,bosses:BOSSES.map(b=>({hp:b.hp,maxhp:b.maxhp,down:b.down})),};
}
function restoreSnap(){
  const s=phaseStartSnap;pc=s.pc;phase=s.phase;items=s.items;
  BOSSES.forEach((b,i)=>{b.hp=s.bosses[i].hp;b.maxhp=s.bosses[i].maxhp;b.down=s.bosses[i].down;b.dispHp=b.hp;});
  SOUL.hp=SOUL.maxhp;SOUL.defMeter=100;
}

/* ================= 流程推进 ================= */
function advance(){
  while(pc<script.length){
    const op=script[pc++];
    if(op.dlg){startDialog(op.dlg,advance);return;}
    if(op.mark==='phase2'){doPhase2();state='phaseflash';pfT=0;return;}
    if(op.turn){
      if(phase===1&&BOSSES.every(b=>b.down)){pc=phase2Idx;continue;}
      if(op.turn.boss!=null&&BOSSES[op.turn.boss].down){
        popups.push({x:BOSSES[op.turn.boss].x,y:BOSSES[op.turn.boss].y,txt:'已消散',c:'#888',t:0,vy:-.5});
        continue;
      }
      pendingTurn=op.turn;
      enterMenu();
      return;
    }
    if(op.win){startVictory();return;}
  }
  startVictory();
}
function doPhase2(){
  phase=2;resetBosses();
  flashA=1;flashC='#ff2222';shake=14;
  AudioSys.phase();Music.start('p2');
  for(let i=0;i<40;i++)particles.push({x:rand(0,W),y:rand(0,H),vx:rand(-.4,.4),vy:rand(-2.4,-.6),c:BOSSES[i%3].color,t:0,life:rand(.8,1.8),r:rand(1,3)});
  snapshot();
}
function nextTargetIdx(){
  if(pendingTurn&&pendingTurn.boss!=null&&!BOSSES[pendingTurn.boss].down)return pendingTurn.boss;
  for(let i=pc;i<script.length;i++){const op=script[i];
    if(op.turn&&op.turn.boss!=null&&!BOSSES[op.turn.boss].down)return op.turn.boss;}
  for(let i=0;i<3;i++)if(!BOSSES[i].down)return i;
  return -1;
}

let dlg=null;
function startDialog(lines,cb){
  dlg={lines:lines.map(l=>wrapText(l,BOARD.w-56,'20px "Microsoft YaHei"')),i:0,ch:0,cb,timer:0};
  state='dialog';
}
function updateDialog(dt){
  const raw=dlg.lines[dlg.i].join('\n');
  if(dlg.ch<raw.length){
    dlg.timer+=dt/60;
    while(dlg.timer>0.028&&dlg.ch<raw.length){dlg.timer-=0.028;dlg.ch++;if(dlg.ch%3===0)AudioSys.text();}
  }
  if(isConfirm()){
    if(dlg.ch<raw.length)dlg.ch=raw.length;
    else{AudioSys.select();dlg.i++;
      if(dlg.i>=dlg.lines.length){const cb=dlg.cb;dlg=null;state='menu';if(cb)cb();}
      else dlg.ch=0;}
  }
}

let flavor='',FT={n:0},menuIdx=0,submenu=null,subIdx=0,subItems=[];
function enterMenu(){
  state='menu';menuIdx=0;submenu=null;
  const t=pendingTurn;
  flavor=t?(t.boss!=null?['* 影·壹盯着你。','* 影·贰的斧刃在滴液。','* 影·叁的手指间全是刀光。'][t.boss]:'* 三道影子同时逼近。'):FLAVOR[Math.floor(rand(0,FLAVOR.length))];
  FT={n:0};
  setBoard(75,245,490,130);
  SOUL.mode='red';
}
function updateMenu(dt){
  FT.n=Math.min(flavor.length,FT.n+dt*0.5);
  if(submenu==='act'||submenu==='item'||submenu==='mercy'){
    if(P('ArrowUp')){subIdx=(subIdx+subItems.length-1)%subItems.length;AudioSys.move();}
    if(P('ArrowDown')){subIdx=(subIdx+1)%subItems.length;AudioSys.move();}
    if(isConfirm()){AudioSys.select();doSub();}
    else if(isCancel()){submenu=null;AudioSys.move();}
    return;
  }
  if(P('ArrowLeft')){menuIdx=(menuIdx+3)%4;AudioSys.move();}
  if(P('ArrowRight')){menuIdx=(menuIdx+1)%4;AudioSys.move();}
  if(isConfirm()){AudioSys.select();openSub();}
}
function openSub(){
  if(menuIdx===0){
    const t=nextTargetIdx();
    if(t<0){flavor='* 没有可以挥刀的目标了。';FT={n:0};return;}
    state='fightbar';FB={t:0,pos:0,done:false,target:t,res:0};
  }
  else if(menuIdx===1){submenu='act';subIdx=0;
    subItems=BOSSES.map((b,i)=>({txt:'查看 '+b.label,boss:i})).filter(o=>!BOSSES[o.boss].down);}
  else if(menuIdx===2){submenu='item';subIdx=0;
    subItems=items>0?[{txt:'影之碎片 ×'+items+'（回复60）'}]:[];}
  else{submenu='mercy';subIdx=0;subItems=[{txt:'饶恕'}];}
}
function doSub(){
  const after=()=>{if(pendingTurn)startTurnPrep(pendingTurn);else advance();};
  if(submenu==='act'){
    const o=subItems[subIdx];submenu=null;
    startDialog([CHECKS[o.boss]],after);
  }else if(submenu==='item'){
    if(!subItems.length){submenu=null;return;}
    items--;SOUL.hp=Math.min(SOUL.maxhp,SOUL.hp+60);AudioSys.heal();
    submenu=null;
    startDialog(['* 你捏碎了影之碎片。\n* 回复了 60 HP。'],after);
  }else{
    submenu=null;
    startDialog([MERCY_RE[Math.floor(rand(0,MERCY_RE.length))]],after);
  }
}

let FB=null,attackAnim=null;
function updateFightbar(dt){
  FB.t+=dt/60;

  if(isConfirm()&&!FB.done){

  }else if(FB.pos>=1&&!FB.done){

function updateAttackanim(dt){
  attackAnim.t+=dt/60;
  const b=BOSSES[attackAnim.target];
  if(attackAnim.t<0.06&&attackAnim.dmg>0&&!attackAnim.sfx){attackAnim.sfx=1;AudioSys.hurt();}
  if(attackAnim.t>0.35&&!attackAnim.applied){
    attackAnim.applied=true;
    if(attackAnim.dmg>0){
      b.hp=Math.max(0,b.hp-attackAnim.dmg);dmgDealt+=attackAnim.dmg;
      popups.push({x:b.x,y:b.y-30,txt:''+attackAnim.dmg,c:attackAnim.dmg>=160?'#ffff38':'#fff',t:0,vy:-1});
      slashes.push({x:b.x,y:b.y,t:0,c:b.color});
      shake=Math.max(shake,4);
    }else popups.push({x:b.x,y:b.y-30,txt:'MISS',c:'#888',t:0,vy:-.8});
  }
  b.dispHp=lerp(b.dispHp,b.hp,.18);
  if(attackAnim.t>0.75){
    if(b.hp<=0&&!b.down){
      b.down=true;AudioSys.down();shake=10;
      popups.push({x:b.x,y:b.y,txt:'消 散',c:b.color,t:0,vy:-.4});
      for(let i=0;i<26;i++)particles.push({x:b.x+rand(-80,80),y:b.y+rand(-16,16),vx:rand(-2,2),vy:rand(-2.5,1),c:b.color,t:0,life:rand(.6,1.4),r:rand(1.5,3.5)});
    }
    const allDown=BOSSES.every(x=>x.down);
    attackAnim=null;
    if(allDown&&phase===2){pendingTurn=null;startDialog(ENDING,startVictory);}
    else if(pendingTurn){
      if(pendingTurn.boss!=null&&BOSSES[pendingTurn.boss].down){pendingTurn=null;advance();}
      else startTurnPrep(pendingTurn);
    }
    else advance();
  }
}
function drawAttackanim(){
  const a=attackAnim,b=BOSSES[a.target];
  if(a.dmg>0&&a.t<0.4){
    ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.globalAlpha=1-a.t/0.4;
    const p=a.t/0.4;
    ctx.beginPath();ctx.moveTo(b.x-70+p*30,b.y-40+p*30);ctx.lineTo(b.x+30+p*30,b.y+60+p*10);ctx.stroke();
    ctx.beginPath();ctx.moveTo(b.x+70-p*30,b.y-40+p*30);ctx.lineTo(b.x-30-p*30,b.y+60+p*10);ctx.stroke();
    ctx.restore();
  }
  drawBosses();
}

let dodge=null;
function makeCtx(pat,dur){
  return {t:0,dur,pat,f:{},c:{},acc:{},
    everyN(id,startT,iv,fn){if(this.t>=startT){const n=Math.floor((this.t-startT)/iv);if(n>(this.c[id]??-1)){this.c[id]=n;fn();}}},
    once(id,t,fn){if(this.t>=t&&!this.f[id]){this.f[id]=1;fn();}}};
}
function startTurnPrep(t){

/* ---- 碰撞 ---- */
function soulMoving(){
  if(SOUL.mode==='blue')return Math.abs(SOUL.vy)>0.25||D('ArrowLeft','ArrowRight');
  return D('ArrowUp','ArrowDown','ArrowLeft','ArrowRight');
}
function hitSoul(dmg){
  if(LOCKHP)return; // 锁血：不受伤、不掉血、不触发黑屏
  if(SOUL.inv>0)return;
  if(D('KeyR')&&SOUL.defMeter>0.5)dmg=Math.max(1,Math.ceil(dmg*0.4));
  SOUL.hp-=dmg;hitsTaken++;SOUL.inv=55;shake=Math.max(shake,7);
  AudioSys.hurt();
  popups.push({x:SOUL.x,y:SOUL.y-14,txt:'-'+dmg,c:'#ff5050',t:0,vy:-.8});
  if(SOUL.hp<=0){SOUL.hp=0;startGameover();}
}
function updateDodge(dt){
  const S=dodge.ctx,b=BOARD,t=dodge.turn;
  bannerT+=dt/60;
  setBoard(75,235,490,150);
  boardLerp();

  // 灵魂移动
  const slow=D('KeyX','ShiftLeft','ShiftRight')?0.5:1;
  const defending=D('KeyR')&&SOUL.defMeter>0.5;
  if(defending){SOUL.defMeter=Math.max(0,SOUL.defMeter-0.7*dt);if(frame%14===0)AudioSys.defend();}
  else SOUL.defMeter=Math.min(100,SOUL.defMeter+0.3*dt);
  const spd=2.6*slow*(defending?0.6:1);
  const px=SOUL.x,py=SOUL.y;
  if(SOUL.mode==='red'){
    let dx=0,dy=0;
    if(D('ArrowLeft'))dx-=1;if(D('ArrowRight'))dx+=1;
    if(D('ArrowUp'))dy-=1;if(D('ArrowDown'))dy+=1;
    const l=Math.hypot(dx,dy)||1;
    SOUL.x+=dx/l*spd*dt*1.0;SOUL.y+=dy/l*spd*dt*1.0;
  }else{
    if(D('ArrowLeft'))SOUL.x-=spd*dt;
    if(D('ArrowRight'))SOUL.x+=spd*dt;
    if((P('ArrowUp')||P('KeyZ'))&&SOUL.onGround){SOUL.vy=-6.7;SOUL.onGround=false;AudioSys.move();}
    SOUL.vy=Math.min(8,SOUL.vy+0.34*dt);
    SOUL.y+=SOUL.vy*dt;
    SOUL.onGround=false;
  }
  SOUL.x=clamp(SOUL.x,b.x+8,b.x+b.w-8);
  SOUL.y=clamp(SOUL.y,b.y+8,b.y+b.h-8);
  if(SOUL.mode==='blue'&&SOUL.y>=b.y+b.h-9){SOUL.y=b.y+b.h-9;SOUL.vy=0;SOUL.onGround=true;}
  SOUL.inv=Math.max(0,SOUL.inv-dt);

  // 弹幕生成
  PATTERNS[S.pat](S);
  S.t+=dt/60;

  // 子弹更新
  const moving=soulMoving();
  for(let i=bullets.length-1;i>=0;i--){
    const u=bullets[i];u.t+=dt/60;
    u.x+=u.vx*dt;u.y+=u.vy*dt;
    if(u.type==='cleaver')u.spin+=0.12*dt;
    if(u.x<b.x-90||u.x>b.x+b.w+90||u.y<b.y-90||u.y>b.y+b.h+90){bullets.splice(i,1);continue;}
    if(u.type==='plat'){
      if(SOUL.mode==='blue'&&SOUL.vy>=0){
        const top=u.y-u.h/2;
        if(py+8<=top+3&&SOUL.y+8>=top&&SOUL.x>u.x-u.w/2-4&&SOUL.x<u.x+u.w/2+4){
          SOUL.y=top-8;SOUL.vy=0;SOUL.onGround=true;
        }
      }
      continue;
    }
    // 伤害判定
    let hit=false;
    if(u.type==='bone'){
      hit=Math.abs(SOUL.x-u.x)<u.w/2+5&&Math.abs(SOUL.y-u.y)<u.h/2+5;
      if(hit&&u.color==='blue')hit=moving;
      else if(hit&&u.color==='orange')hit=!moving;
    }else if(u.type==='knife'||u.type==='cleaver'){
      const r=u.type==='knife'?8:11;
      hit=Math.hypot(SOUL.x-u.x,SOUL.y-u.y)<r+5;
    }
    if(hit)hitSoul(u.dmg);
  }
  // 光炮更新
  for(let i=blasters.length-1;i>=0;i--){
    const bl=blasters[i];bl.t+=dt/60;
    if(!bl.fired&&bl.t>=bl.charge){bl.fired=true;AudioSys.blast();shake=Math.max(shake,5);}
    if(bl.fired&&bl.t<bl.charge+bl.fire*0.8){
      const mx=bl.x+Math.cos(bl.ang)*26,my=bl.y+Math.sin(bl.ang)*26;
      const dx=SOUL.x-mx,dy=SOUL.y-my;
      const proj=dx*Math.cos(bl.ang)+dy*Math.sin(bl.ang);
      const perp=Math.abs(-dx*Math.sin(bl.ang)+dy*Math.cos(bl.ang));
      const frac=(bl.t-bl.charge)/bl.fire;
      const bw=bl.bw*(frac<0.7?1:1-(frac-0.7)/0.3);
      if(proj>0&&proj<bl.len&&perp<bw/2+4)hitSoul(10);
    }
    if(bl.t>bl.charge+bl.fire+0.3)blasters.splice(i,1);
  }

  if(S.t>=S.dur){endDodge();}
}
let spawnPart=0;

/* ---- 弹幕绘制 ---- */
function drawBone(u){
  ctx.save();ctx.translate(u.x,u.y);
  let col='#fff';
  if(u.color==='blue')col='#4aa8ff';if(u.color==='orange')col='#ff9c30';
  ctx.shadowColor=col;ctx.shadowBlur=6;ctx.fillStyle=col;
  const vert=u.h>=u.w;
  if(vert){
    ctx.fillRect(-u.w/2+2,-u.h/2+6,u.w-4,u.h-12);
    ctx.beginPath();ctx.arc(0,-u.h/2+4,u.w*0.62,0,TAU);ctx.arc(0,u.h/2-4,u.w*0.62,0,TAU);ctx.fill();
  }else{
    ctx.fillRect(-u.w/2+6,-u.h/2+2,u.w-12,u.h-4);
    ctx.beginPath();ctx.arc(-u.w/2+4,0,u.h*0.62,0,TAU);ctx.arc(u.w/2-4,0,u.h*0.62,0,TAU);ctx.fill();
  }
  ctx.restore();
}
function drawKnife(u){
  ctx.save();ctx.translate(u.x,u.y);
  const ang=u.homing&&Math.hypot(u.vx,u.vy)>0.1?Math.atan2(u.vy,u.vx):(u.vx||u.vy?Math.atan2(u.vy,u.vx):Math.PI/2);
  ctx.rotate(ang+Math.PI/2);
  ctx.shadowColor='#fff';ctx.shadowBlur=4;
  ctx.fillStyle='#eee';
  ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(4,0);ctx.lineTo(-4,0);ctx.closePath();ctx.fill();
  ctx.fillStyle='#999';ctx.fillRect(-2.5,0,5,8);
  ctx.restore();
}
function drawCleaver(u){
  ctx.save();ctx.translate(u.x,u.y);ctx.rotate(u.spin);
  ctx.shadowColor='#fff';ctx.shadowBlur=5;
  ctx.fillStyle='#ddd';ctx.fillRect(-13,-7,26,14);
  ctx.fillStyle='#8a5a2b';ctx.fillRect(-3,-15,6,10);
  ctx.fillStyle='#bbb';ctx.fillRect(-13,-7,26,3);
  ctx.restore();
}
function drawBlaster(bl){
  ctx.save();ctx.translate(bl.x,bl.y);ctx.rotate(bl.ang);
  const appear=Math.min(1,bl.t/0.25);
  const open=bl.t<bl.charge?(bl.t-bl.charge*0.4)/bl.charge*10:bl.fired?Math.max(0,10-(bl.t-bl.charge)*26):0;
  ctx.scale(appear,appear);
  ctx.shadowColor='#fff';ctx.shadowBlur=8;
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.ellipse(0,0,20,13,0,0,TAU);ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(8,0,9,7,0,0,TAU);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.fillRect(10,-10-open,16,7);ctx.fillRect(10,3+open,16,7);
  ctx.restore();
  if(bl.fired&&bl.t<bl.charge+bl.fire){
    const frac=(bl.t-bl.charge)/bl.fire;
    const bw=bl.bw*(frac<0.7?1:1-(frac-0.7)/0.3);
    const mx=bl.x+Math.cos(bl.ang)*26,my=bl.y+Math.sin(bl.ang)*26;
    ctx.save();ctx.translate(mx,my);ctx.rotate(bl.ang);
    ctx.shadowColor='#fff';ctx.shadowBlur=18;
    ctx.fillStyle='rgba(255,255,255,.92)';ctx.fillRect(0,-bw/2,bl.len,bw);
    ctx.fillStyle='rgba(160,220,255,.5)';ctx.fillRect(0,-bw/2-3,bl.len,bw+6);
    ctx.restore();
  }
}
function drawDodge(){
  const b=BOARD;
  ctx.save();
  ctx.beginPath();ctx.rect(b.x,b.y,b.w,b.h);ctx.clip();
  for(const u of bullets){
    if(u.type==='bone')drawBone(u);
    else if(u.type==='knife')drawKnife(u);
    else if(u.type==='cleaver')drawCleaver(u);
    else if(u.type==='plat'){
      ctx.save();ctx.translate(u.x,u.y);
      ctx.shadowColor='#4aa8ff';ctx.shadowBlur=6;ctx.fillStyle='#4aa8ff';
      ctx.fillRect(-u.w/2+5,-u.h/2+2,u.w-10,u.h-4);
      ctx.beginPath();ctx.arc(-u.w/2+4,0,u.h*0.6,0,TAU);ctx.arc(u.w/2-4,0,u.h*0.6,0,TAU);ctx.fill();
      ctx.restore();
    }
  }
  for(const bl of blasters)drawBlaster(bl);
  // 灵魂
  if(!(SOUL.inv>0&&frame%10<5)){
    const col=SOUL.mode==='blue'?'#00a2e8':'#ff0030';
    drawHeart(SOUL.x,SOUL.y,col,1.25);
    if(D('KeyR')&&SOUL.defMeter>0.5){
      ctx.strokeStyle='rgba(57,197,207,.8)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(SOUL.x,SOUL.y,13+Math.sin(time*10)*1.5,0,TAU);ctx.stroke();
    }
  }
  ctx.restore();
  // 回合横幅
  if(bannerT<1.8){
    const a=bannerT<1.3?1:1-(bannerT-1.3)/0.5;
    ctx.save();ctx.globalAlpha=a;
    glowText(bannerTxt,b.x+b.w/2,b.y-16,20,'#fff',10,'none');
    ctx.restore();
  }
}

function updateFx(dt){

  for(let i=slashes.length-1;i>=0;i--){slashes[i].t+=dt/60;if(slashes[i].t>0.4)slashes.splice(i,1);}
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.t+=dt/60;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=0.03*dt;
    if(p.t>p.life)particles.splice(i,1);

  if(phase===2&&frame%6===0&&state!=='title')

  flashA=Math.max(0,flashA-0.05*dt);

function drawFx(){

  }

<script>

;(function(){

/* ---------- 音频 ---------- */
let AC=null, master=null, musicOn=false;
function initAudio(){

}

  if(!AC) return;

  const f=AC.createBiquadFilter(); f.type='lowpass'; const t=AC.currentTime;

  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+dur+.02);
}
const sfx = {
  move(){ beep(660,.05,'square',.06); },

  blip(){ beep(720,.03,'square',.045); },

  dodge(){ beep(500,.09,'square',.07,1200); },
  charge(d){ beep(160,d||.6,'sawtooth',.10,950); },

  heal(){ beep(660,.12,'triangle',.12); setTimeout(()=>beep(990,.18,'triangle',.12),110); },
  shatter(){ noise(.6,.3,2400,120); beep(600,.5,'sawtooth',.1,50); },

/* --- Megalovania 风格循环 (芯片音) --- */
function hz(n){ // 'D2' 'G#2' 'F#3'
  if(!n) return 0;
  const m=n.match(/^([A-G])(#?)(\d)$/); if(!m) return 0;
  const base={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]] + (m[2]?1:0);
  const oct=+m[3];
  return 440*Math.pow(2,(base+(oct+1)*12-69)/12);
}
const RIFF = ['D','D','D3','A',0,'G#',0,'G',0,'F',0,'D','F','G',0,0]; // 根音名,每轮降半音
const ROOTS = ['2','2','2','2']; // 占位
function riffFreq(root, step){
  const n = RIFF[step]; if(!n) return 0;

/* ---------- 全局状态 ---------- */

/* ---------- 战斗框 ---------- */
const box = { x:320-130, y:250-80, w:260, h:160, tx:320-130, ty:250-80, tw:260, th:160 };
function boxSet(x,y,w,h){ box.tx=x; box.ty=y; box.tw=w; box.th=h; }

/* ---------- 玩家之心 ---------- */
const soul = { x:320, y:250, mode:'red', vy:0, grounded:false };

function spawnBone(o){ bones.push(Object.assign({vx:0,vy:0,cyan:false},o)); }
function spawnBlaster(x,y,ang,len,wid,charge,delay=0){
  beams.push({x,y,ang,len,wid,t:-delay,charge:charge||.65,fireDur:.5});
  if(delay===0) sfx.charge(charge||.65);
}
function updBullets(dt){
  for(const b of bones){ b.x+=b.vx*dt; b.y+=b.vy*dt; }
  bones = bones.filter(b=>{
    if(b.life!==undefined){ b.life-=dt; if(b.life<=0) return false; }
    return b.x>-260 && b.x<W+260 && b.y>-260 && b.y<H+260;
  });
  for(const bm of beams){
    bm.t += dt;
    if(bm.t<0) continue;
    if(bm.t>=0 && bm.t-dt<0) sfx.charge(bm.charge);
    if(bm.t>=bm.charge && bm.t-dt<bm.charge) sfx.fire();
    if(bm.t>bm.charge && bm.t<bm.charge+bm.fireDur){
      // 激光伤害:点到线段距离
      const dx=Math.cos(bm.ang), dy=Math.sin(bm.ang);
      const pxs=soul.x-bm.x, pys=soul.y-bm.y;
      const proj=pxs*dx+pys*dy;
      if(proj>0 && proj<bm.len){
        const dist=Math.abs(-pxs*dy+pys*dx);
        if(dist < bm.wid/2+4) dmgPlayer(8);
      }
    }
  }
  beams = beams.filter(b=> b.t < b.charge+b.fireDur+.1);
  // 骨头碰撞
  for(const b of bones){
    const r=soulRect();
    if(b.cyan){
      const moving = keys.left||keys.right||keys.up||keys.down;
      if(moving && overlap(r.x,r.y,r.w,r.h,b.x,b.y,b.w,b.h)) dmgPlayer(5);
    }else if(overlap(r.x,r.y,r.w,r.h,b.x,b.y,b.w,b.h)) dmgPlayer(5);
  }
}
function drawBones(){
  for(const b of bones){
    const c = b.cyan? '#28d7ff' : '#fff';
    X.fillStyle=c;
    if(b.w>b.h){ // 横骨
      X.fillRect(b.x+5,b.y,b.w-10,b.h);
      X.fillRect(b.x,b.y+b.h*.25,10,b.h*.5);
      X.fillRect(b.x+b.w-10,b.y+b.h*.25,10,b.h*.5);
    }else{       // 竖骨
      X.fillRect(b.x,b.y+5,b.w,b.h-10);
      X.fillRect(b.x+b.w*.25,b.y,b.w*.5,10);
      X.fillRect(b.x+b.w*.25,b.y+b.h-10,b.w*.5,10);
    }
  }
  for(const bm of beams){
    X.save(); X.translate(bm.x,bm.y); X.rotate(bm.ang);
    if(bm.t<0){}
    else if(bm.t<bm.charge){ // 蓄力
      const k=bm.t/bm.charge;
      drawBlasterHead(0,0,k);
      X.globalAlpha=.6; X.fillStyle='#fff';
      X.fillRect(0,-2+k, bm.len*Math.min(1,k*1.6), 4-k*2+1);
      X.globalAlpha=1;
    }else{ // 开火
      const ft=(bm.t-bm.charge)/bm.fireDur;
      const w=bm.wid*(1-ft*.55)*(0.85+0.15*Math.sin(T*60));
      X.fillStyle='rgba(255,255,255,.28)'; X.fillRect(0,-w*.85,bm.len,w*1.7);
      X.fillStyle='#fff'; X.fillRect(0,-w/2,bm.len,w);
      drawBlasterHead(0,0,1.25);
    }
    X.restore();
  }
}
function drawBlasterHead(x,y,k){ // 简化冲击炮骷髅头
  X.save(); X.translate(x,y); X.scale(k,k);
  X.fillStyle='#fff';
  X.beginPath(); X.arc(0,0,13,0,7); X.fill();          // 头
  X.fillRect(-9,4,18,10);                               // 颚
  X.fillStyle='#000';
  X.beginPath(); X.arc(-5,-2,4,0,7); X.arc(5,-2,4,0,7); X.fill(); // 眼
  X.fillRect(-6,7,3,4); X.fillRect(0,7,3,4); X.fillRect(5,7,3,4); // 牙
  X.fillStyle='#fff';
  X.beginPath(); X.moveTo(-14,-8); X.lineTo(-22,-16); X.lineTo(-12,-14); X.fill(); // 角
  X.beginPath(); X.moveTo(14,-8);  X.lineTo(22,-16);  X.lineTo(12,-14); X.fill();
  X.restore();
}

    say([st.heal>=30? '……歇会儿吧。':'再来一口,别客气。','你的 best friend 递来一杯热茶。','HP 回复 '+st.heal+',KR 缓解了!'], ()=>{
      healPlayer(st.heal, st.krCut);
      setTimeout(()=>{ if(scene==='battle'&&battle.phase==='rest') afterRest(); }, 600);
    });
    return;
  }
  if(st.gaster){
    battle.phase='gaster';
    battle.gasterT=0;
    scene='gasterfx';
    say(st.dlg, ()=>{ runGaster(); });
    return;
  }
  say(st.dlg, ()=>{
    battle.phase='attack';
    startAttack(st.pat, st.dur);
  });
}
function afterRest(){
  battle.phase='menu'; toMenu();
}
function afterAttack(){
  bones=[];beams=[];spawners=[];
  soul.mode='red'; grav={x:0,y:1}; view.target=0;
  battle.phase='menu';
  toMenu();
}
function toMenu(){
  battle.phase='menu';
  boxSet(boxUI().x, boxUI().y, boxUI().w, boxUI().h);
  soul.x = 70; soul.y = 320;
  battle.menuIdx=0; battle.usedItemThisTurn=false;
}
/* FIGHT:BOSS 闪避 */
function doFight(){
  battle.phase='fight-anim'; battle.fightAnim=0; sfx.slash();
}
function updFightAnim(dt){
  battle.fightAnim+=dt;
  if(battle.fightAnim>.45 && !battle.dodged){
    battle.dodged=true; sfx.dodge();
    battle.missPop=1;
  }
  if(battle.fightAnim>1.2){
    battle.dodged=false; battle.missPop=0;
    battle.phase='dialog';
    nextStep();
  }
}
function drawFightAnim(){
  const t=battle.fightAnim;
  // 斩击弧线
  X.save(); X.translate(boss.x+boss.dodgeX, boss.y);
  if(t<.45){
    X.strokeStyle='#ff4040'; X.lineWidth=5;
    for(let i=0;i<3;i++){
      const k=clamp(t*3-i*.12,0,1);
      X.globalAlpha=k;
      X.beginPath(); X.arc(0,-10+i*16, 60, -2.4+k*2, -2.4+k*2+.9); X.stroke();
    }
    X.globalAlpha=1;
  }
  X.restore();
  if(battle.missPop>0){
    const k=1-battle.missPop;
    txt('MISS', boss.x+boss.dodgeX+90, boss.y-40-k*30, 26, '#fff');
  }
  // 攻击条
  if(t<.45){
    X.strokeStyle='#fff'; X.lineWidth=3;
    X.strokeRect(170,400,300,40);
    const k=t/.45;
    X.fillStyle='#ff4040'; X.fillRect(320-2+ (k*2-1)*140, 402, 4, 36);
  }
}
/* ACT / ITEM / MERCY */
function doAct(){
  battle.phase='dialog';
  say(['YOUR BEST FRIND:刘嘉烨 — ATK 1 DEF 1','你最好的朋友。TA 回避了一切攻击。','( KR:被朋友的攻击命中后,HP 会持续流失 )'], ()=>{ nextStep(); });
}
function doItem(){
  battle.phase='dialog';
  if(battle.usedItemThisTurn){
    say(['( 传说英雄管够,但一回合只能吃一根 )'], ()=>{ nextStep(); });
    return;
  }
  battle.usedItemThisTurn=true;
  healPlayer(15, 0);
  say(['你吃掉了「传说英雄」。( 库存:∞ )','HP 回复了 15 点!'], ()=>{ nextStep(); });
}
function doMercy(){
  battle.phase='dialog';
  say(['你试图饶恕 TA。','发光的文字温柔地飘开了:','「现在还不是做朋友的时候……出招吧!」'], ()=>{ nextStep(); });
}
/* ---------- GASTER 阶段 ---------- */
function runGaster(){
  scene='battle'; battle.phase='attack';
  startAttack('gasterBeam', battle.steps[battle.stepIdx].dur);
  sfx.boom();
}
function drawGasterHands(){
  // 两侧悬浮手
  const y=box.y+box.h/2;
  for(const side of [-1,1]){
    const hx = box.x+box.w/2 + side*(200+Math.sin(T*2)*10);
    X.save(); X.translate(hx,y+Math.sin(T*3+side)*8); X.scale(side,1);
    X.fillStyle='#fff';
    // 掌
    X.beginPath(); X.roundRect(-16,-26,32,52,8); X.fill();
    for(let i=0;i<4;i++){ X.beginPath(); X.roundRect(-14+i*8, -40, 6, 18, 3); X.fill(); }
    X.fillStyle='#000'; X.beginPath(); X.arc(0,0,6,0,7); X.fill(); // 掌心洞
    X.restore();
  }
}
/* ---------- 终局 ---------- */
function startFinale(){
  battle.phase='tired'; battle.tiredT=0;
  music.stop();
  bones=[];beams=[]; soul.mode='red'; grav={x:0,y:1}; view.target=0;
  say(['哈……哈……好吧。','我累了。','你知道的……我做不到的。','这具身体,只剩下最后一点力气了……'], ()=>{
    battle.phase='sleep'; battle.sleepT=0;
    boss.asleep=true;
    battle.strikeCursor=0; battle.strikeDir=1; battle.strikeHit=false;
    boxSet(boxUI().x, boxUI().y, boxUI().w, boxUI().h);
  });
}
function updSleep(dt){
  battle.sleepT+=dt;
  if(!battle.strikeHit){
    battle.strikeCursor += battle.strikeDir*dt*.9;
    if(battle.strikeCursor>1){battle.strikeCursor=1;battle.strikeDir=-1;}
    if(battle.strikeCursor<0){battle.strikeCursor=0;battle.strikeDir=1;}
    if(hits.ok && battle.sleepT>1){
      battle.strikeHit=true; battle.phase='strike'; battle.strikeT=0;
      sfx.slash();
    }
  }
}
function drawSleepUI(){
  txt('TA 睡着了!按 Z 推动攻击 —— 在指针靠近中心时按下!', 320, 205, 15, '#ffd24a', 'center');
  // 攻击条
  const bx=170,by=408,bw=300,bh=40;
  X.strokeStyle='#fff'; X.lineWidth=3; X.strokeRect(bx,by,bw,bh);
  for(let i=0;i<10;i++){ X.fillStyle='rgba(255,255,255,.15)'; X.fillRect(bx+i*bw/10,by,bw/10-2,bh); }
  const c=bx+battle.strikeCursor*bw;
  X.fillStyle='#fff'; X.fillRect(c-2,by,4,bh);
  X.fillStyle='#ffd24a'; X.fillRect(bx+bw/2-10,by,20,bh);
  if(battle.strikeHit){ /* below */ }
}
function updStrike(dt){
  battle.strikeT=(battle.strikeT||0)+dt;
  if(battle.strikeT===dt){ // 命中判定
    const dist=Math.abs(battle.strikeCursor-.5);
    battle.perfect = dist<.08;
    flash=1; sfx.boom(); shake=10;
    // 文字炸裂成粒子
    const bx=boss.x+boss.dodgeX, by=boss.y;
    const chars=(boss.line1+boss.name).split('');
    for(let i=0;i<90;i++){
      const ch=chars[i%chars.length];
      bossParticles.push({
        ch, x:bx+rnd(-70,70), y:by+rnd(-30,30),
        vx:rnd(-140,140), vy:rnd(-260,-40),
        rot:rnd(0,6.28), vr:rnd(-4,4), life:rnd(1.6,3.2), size:rnd(14,30),
        glow:Math.random()<.5?'#ffd24a':'#7fd8ff'
      });
    }
    boss.alpha=0;
  }
  if(battle.strikeT>1.4 && !battle.endTalk){
    battle.endTalk=true;
    say(['welp. 我要去 grillby\'s 酒吧了。','替我……向大家问好。','你的 best friend:刘嘉烨,先走一步。'], ()=>{
      scene='end'; sfx.shatter();
    });
  }
}
function drawStrike(){
  const t=battle.strikeT||0;
  if(t<.4){
    X.save(); X.translate(boss.x+boss.dodgeX, boss.y);
    X.strokeStyle='#fff'; X.lineWidth=7;
    X.globalAlpha=1-t*2;
    X.beginPath(); X.arc(0,0,80,-2.6+t*6,-2.6+t*6+1.4); X.stroke();
    X.globalAlpha=1; X.restore();
  }
  if(t>.5 && t<1.3){
    const q=battle.perfect?'完美一击!!':'打中了!';
    txt(q, 320, 210, 24, battle.perfect?'#ffd24a':'#fff', 'center');
  }
}
/* ---------- 死亡 / GAME OVER ---------- */
let deadParts=[];
function die(){
  if(scene!=='battle') return;
  scene='dying'; dyingT=0; music.stop(); sfx.crack();
  deadParts=[];
}
let dyingT=0;
function updDying(dt){
  dyingT+=dt;
  if(dyingT>.8 && deadParts.length===0){
    sfx.shatter();
    for(let i=0;i<6;i++) deadParts.push({x:soul.x, y:soul.y, vx:rnd(-90,90), vy:rnd(-160,-40)});
  }
  for(const p of deadParts){ p.vy+=400*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
  if(dyingT>2.6){ scene='gameover'; }
}
function drawDying(){
  if(dyingT<.8) heart(soul.x, soul.y, 13, '#fff');
  for(const p of deadParts) heart(p.x,p.y,6,'#ff2222');
}
/* ============================================================
   场景:标题 / 开场
   ============================================================ */
const intro = {lines:[
  '外面天气真好。',
  '鸟儿在歌唱,花儿在绽放……',
  '这样的日子里,像你这样的孩子……',
  '就该在地狱里,熊熊燃烧。'
], i:0};
function startIntro(){ scene='intro'; intro.i=0; say([intro.lines[0]], nextIntro); }
function nextIntro(){
  intro.i++;
  if(intro.i<intro.lines.length) say([intro.lines[intro.i]], nextIntro);
  else startBattle();
}
/* 双战合一：第二战起始血量 = 第一战剩余血量（不再重置为满血；单独运行本战时回退为满血） */
let inheritHP=null;
function setInheritHP(hp){
  if(typeof hp==='number'&&isFinite(hp)) inheritHP=Math.max(1, Math.min(MAXHP, Math.round(hp)));
  else inheritHP=MAXHP;
  P.hp=inheritHP; P.kr=0; P.inv=0;
}
function startBattle(){
  scene='battle';
  battle.phase='dialog'; battle.stepIdx=-1; battle.turn=0;
  /* 继承第一战剩余 HP：含死亡后重挑，仍以继承值为基准，不自动回满 */
  P.hp=(inheritHP==null?MAXHP:inheritHP); P.kr=0; P.inv=0;
  boss.alpha=1; boss.asleep=false; boss.tired=0; boss.dodgeX=0;
  bossParticles=[]; deadParts=[]; bones=[]; beams=[];
  music.start();
  say(['你的 best friend:刘嘉烨 挡在了路上。'], ()=>{ toMenu(); });
}
/* ============================================================
   主更新
   ============================================================ */
function update(dt){
  if(cheat.lock!==window.Shell.lockHP){ cheat.lock=window.Shell.lockHP; if(cheat.lock)P.kr=0; }
  T+=dt;
  if(shake>0) shake=Math.max(0,shake-dt*30);
  if(flash>0) flash=Math.max(0,flash-dt*2.5);
  updView(dt);
  updBox(dt);
  updDlg(dt);
  updKR(dt);
  for(const p of bossParticles){
    p.life-=dt; p.vy+=300*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
  }
  bossParticles=bossParticles.filter(p=>p.life>0);

  if(scene==='title'){
    if(hits.ok){ sfx.sel(); startIntro(); }
  }
  else if(scene==='dying'){ updDying(dt); }
  else if(scene==='battle'){
    if(battle.phase==='menu'){
      // 菜单选择
      if(hits.left){ battle.menuIdx=(battle.menuIdx+3)%4; sfx.move(); }
      if(hits.right){ battle.menuIdx=(battle.menuIdx+1)%4; sfx.move(); }
      if(hits.ok){
        sfx.sel();
        [doFight, doAct, doItem, doMercy][battle.menuIdx]();
      }
      // 心跟随按钮
      const btns=menuBtns();
      soul.x=lerp(soul.x, btns[battle.menuIdx].x-18, dt*12);
      soul.y=lerp(soul.y, btns[battle.menuIdx].y+13, dt*12);
    }
    else if(battle.phase==='fight-anim'){ updFightAnim(dt); }
    else if(battle.phase==='attack'){
      updSoul(dt);
      if(atk){
        atk.t+=dt;
        PATTERNS[atk.pattern](dt);
        updBullets(dt);
        if(atk.t>=atk.dur){ atk=null; afterAttack(); }
      }
    }
    else if(battle.phase==='dialog' || battle.phase==='rest' || battle.phase==='gaster' || battle.phase==='tired'){ /* 对话驱动 */ }
    else if(battle.phase==='sleep'){ updSleep(dt); }
    else if(battle.phase==='strike'){ updStrike(dt); }
  }
  for(const k in hits) delete hits[k];
}
/* ---------- 菜单按钮 ---------- */
function menuBtns(){
  const y=412, w=118, h=42, gap=22;
  const total=4*w+3*gap;
  const x0=(W-total)/2;
  return [0,1,2,3].map(i=>({x:x0+i*(w+gap), y, w, h}));
}
const BTN_LABEL=[['战斗','FIGHT'],['行动','ACT'],['物品','ITEM'],['仁慈','MERCY']];
function drawMenu(){
  const btns=menuBtns();
  btns.forEach((b,i)=>{
    X.strokeStyle='#ff7f27'; X.lineWidth=3;
    X.strokeRect(px(b.x),px(b.y),px(b.w),px(b.h));
    txt(BTN_LABEL[i][0], b.x+b.w/2, b.y+6, 16, '#ff7f27', 'center');
    txt(BTN_LABEL[i][1], b.x+b.w/2, b.y+24, 11, '#ff7f27', 'center');
    if(battle.menuIdx===i){
      X.strokeStyle='#fff'; X.lineWidth=1.5;
      X.strokeRect(px(b.x-3),px(b.y-3),px(b.w+6),px(b.h+6));
    }
  });
}
/* ============================================================
   渲染
   ============================================================ */
function render(){
  X.setTransform(1,0,0,1,0,0);
  X.fillStyle='#000'; X.fillRect(0,0,W,H);
  if(shake>0) X.translate(rnd(-shake,shake), rnd(-shake,shake));

  if(scene==='title'){
    glowText('审判走廊 · BOSS 战复刻', 320, 150, 34, '#fff', '#ffd24a', 24);
    glowText('your best frind:刘嘉烨', 320, 230, 44, '#fff', '#7fd8ff', 26);
    txt('一比一还原整场 BOSS 战流程', 320, 290, 16, '#888', 'center');
    if(Math.sin(T*4)>-.3) txt('— 按 Z 开始 —', 320, 350, 18, '#fff', 'center');
    txt('方向键/WASD 移动 · Z 确认 · X 取消/慢速', 320, 420, 13, '#555', 'center');
    return;
  }
  if(scene==='gameover'){
    txt('GAME OVER', 320, 120, 44, '#fff', 'center');
    X.save(); X.globalAlpha=.9;
    for(const p of deadParts) heart(p.x,p.y,6,'#ff2222');
    X.restore();
    if(dyingT>2.6 || scene==='gameover'){
      txt('* 你死在了你最好朋友的手里。', 320, 220, 18, '#fff', 'center');
      txt('* 你不能就这样放弃……', 320, 252, 18, '#fff', 'center');
      glowText('保持决心!', 320, 300, 30, '#fff', '#ff4040', 18);
      if(Math.sin(T*4)>-.3) txt('— 按 Z 重新挑战 —', 320, 370, 16, '#fff', 'center');
    }
    if(hits.ok){ sfx.sel(); startBattle(); }
    return;
  }
  if(scene==='end'){
    glowText('THE END', 320, 150, 46, '#fff', '#ffd24a', 26);
    for(const p of bossParticles){ /* 落幕文字仍飘散 */ }
    drawParticles();
    txt('你赢下了这场与 best friend 的对决。', 320, 240, 17, '#fff', 'center');
    txt('—— 审判走廊之战 · 完 ——', 320, 270, 15, '#888', 'center');
    if(Math.sin(T*4)>-.3) txt('— 按 Z 查看最终结算 —', 320, 340, 15, '#fff', 'center');
    if(hits.ok){ sfx.sel(); window.Shell.p2Finished(); }
    return;
  }

  /* ---- 战斗场景通用(整体随重力视角旋转) ---- */
  X.save();
  X.translate(320,240); X.rotate(view.angle); X.translate(-320,-240);
  // GASTER 阶段背景暗紫
  if(battle.phase==='attack' && atk && atk.pattern==='gasterBeam'){
    X.fillStyle='rgba(30,0,50,.45)'; X.fillRect(0,0,W,H);
    glowText('刘嘉烨', 320, 120, 150, 'rgba(120,40,190,.16)', '#7a2bd6', 60, 'center', .5);
  }
  if(scene!=='intro' || true) drawBoss();
  drawParticles();

  // 战斗框(对话时由对话框代替)
  if(!dlg.on){
    X.strokeStyle='#fff'; X.lineWidth=4;
    X.strokeRect(px(box.x),px(box.y),px(box.w),px(box.h));
  }
  if(battle.phase==='attack' && atk){
    if(atk.pattern==='gasterBeam') drawGasterHands();
    drawBones();
    drawSoul();
    // 倒计时
    txt('+'+Math.max(0,Math.ceil(atk.dur-atk.t))+'s', box.x+box.w-30, box.y-18, 12, '#666');
  }
  if(scene==='dying'){ drawDying(); }

  // 底部 UI
  if(scene==='battle'||scene==='gasterfx'){
    drawHPBar();
    if(battle.phase==='menu') drawMenu();
    if(battle.phase==='sleep') drawSleepUI();
  }
  drawDlg();

  X.restore(); // 结束视角旋转
  X.setTransform(1,0,0,1,0,0);
  // 闪光
  if(flash>0){ X.fillStyle=`rgba(255,255,255,${flash})`; X.fillRect(0,0,W,H); }
}
function drawParticles(){
  for(const p of bossParticles){
    X.save(); X.translate(p.x,p.y); X.rotate(p.rot);
    X.globalAlpha=clamp(p.life,0,1);
    glowText(p.ch, 0, 0, p.size, '#fff', p.glow, 12, 'center');
    X.restore();
  }
  X.globalAlpha=1;
}
function drawHPBar(){
  txt('CHARA', 24, 380, 15, '#fff');
  txt('LV 19', 96, 380, 15, '#fff');
  txt('HP', 158, 380, 13, '#fff');
  const bx=182, by=380, bh=17, L=124;
  const redW=(MAXHP-P.kr)/MAXHP*L;
  const ylw=P.hp/MAXHP*L;
  X.fillStyle='#7a0000'; X.fillRect(bx,by,L,bh);
  X.fillStyle='#ff0000'; X.fillRect(bx,by,redW,bh);
  X.fillStyle='#ffff00'; X.fillRect(bx,by,ylw,bh);
  txt('KR', bx+L+14, 380, 14, '#fff');
  txt(String(P.hp)+' / '+MAXHP, bx+L+40, 380, 14, '#fff');
}
/* ---------- 调试句柄(测试用) ---------- */
window.GAME = {
  get scene(){ return scene; }, set scene(v){ scene=v; },
  battle, P, boss, startBattle, startFinale,
  get dlg(){ return {on:dlg.on, li:dlg.li, ci:dlg.ci, n:dlg.lines.length, lines:dlg.lines}; },
  nextStep(){ nextStep(); },
  hurt(n){ dmgPlayer(n); }
};
/* ---------- 主循环 ---------- */
let last=performance.now();
function loop(now){
  if(!window.Shell.active(2)){last=now;requestAnimationFrame(loop);return;}
  let dt=(now-last)/1000; last=now;
  dt=Math.min(dt,.05);
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.Shell=window.Shell||{};
window.Shell.m2={
  start:function(hp){try{setInheritHP(hp);startIntro();}catch(err){console.error('[Battle2] start failed:',err);}},
  setMuted:function(m){try{cheat.mute=!!m;if(typeof MA!=='undefined')MA.muted=!!m;if(typeof AC!=='undefined'&&AC.muted!==undefined)AC.muted=!!m;}catch(e){}},
  stats:function(){return {hp:P.hp,kr:P.kr,maxhp:MAXHP};}
};

})();
</script>
